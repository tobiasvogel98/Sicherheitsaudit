      `${rep.neu} neue Datensätze werden übernommen\n${rep.akt} Datensätze sind dort neuer und werden aktualisiert\n${rep.behalten} sind hier neuer und bleiben unverändert\n${rep.gleich} sind identisch\n\n`+
      rep.det.map(x=>`· ${x.key}: ${x.n} neu, ${x.a} aktualisiert, ${x.b} behalten`).join('\n')+
      '';
    dlg({titel:'Daten zusammenführen?',text:txt,ok:'Abgleich durchführen'}).then(j=>{if(!j)return;
    mergeApply(d);snapSig();save();
    DB.cfg.letzterAbgleich={geraet:(d.geraet||{}).name||'?',am:new Date().toISOString(),neu:rep.neu,akt:rep.akt};save();
    render();toast(`Abgleich fertig: ${rep.neu} neu, ${rep.akt} aktualisiert.`);});
  }).catch(()=>toast('Datei ungültig oder kein Backup dieses Programms.'));}

/* ---------- PDF-Berichte (eigener Erzeuger, funktioniert auch dort, wo Drucken gesperrt ist) ---------- */
const AMPELFARBE={'Grün':'0.18 0.55 0.34','Gelb':'0.84 0.63 0.00','Orange':'0.88 0.45 0.11','Rot':'0.77 0.19 0.17','Grau':'0.60 0.63 0.66'};
const IM_RAHMEN=(function(){try{return window.self!==window.top;}catch(e){return true;}})();

function alsJpeg(url){
  return new Promise(res=>{
    if(!url)return res('');
    if(url.indexOf('data:image/jpeg')===0)return res(url);
    const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=img.width||600;c.height=img.height||200;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0);
      try{res(c.toDataURL('image/jpeg',.85));}catch(e){res('');}};
    img.onerror=()=>res('');
    img.src=url;});}


/* v6: Bericht direkt weitergeben (Mail, Teams, WhatsApp ...). Nur moeglich,
   wenn die Seite selbst im Browser laeuft - im eingebetteten Fenster gesperrt. */
function teilenMoeglich(bytes,name){
  try{
    if(IM_RAHMEN||!navigator.share||typeof File!=='function')return null;
    const f=new File([bytes],name,{type:'application/pdf'});
    if(navigator.canShare&&!navigator.canShare({files:[f]}))return null;
    return f;
  }catch(e){return null;}
}
async function pdfSenden(name,bytes){
  const f=teilenMoeglich(bytes,name);
  if(!f)return false;
  const w=await dlg({titel:'Bericht ist fertig',text:name+'\n\nDirekt an die Bauleitung senden, oder nur auf dem Gerät speichern?',ok:'Senden',abbrechen:'Nur speichern'});
  if(!w)return false;
  try{await navigator.share({files:[f],title:name});toast('Bericht gesendet');return true;}
  catch(e){if(e&&e.name==='AbortError'){toast('Senden abgebrochen');return true;}
    toast('Senden nicht möglich – Bericht wird gespeichert');return false;}
}

async function pdfSpeichern(name,d){
  const bytes=d.bytes();
  let dl2=null;try{if(window.claude&&claude.use)dl2=await claude.use('downloads');}catch(e){}
  if(dl2){
    try{await dl2.save({filename:name,data:bytes.buffer.slice(0)});toast('PDF gespeichert: '+name);return true;}
    catch(e){
      if(e&&e.code==='declined')return false;
      if(e&&e.code==='extension_not_enabled'){
        try{await dl2.save({filename:name+'.txt',data:bytes.buffer.slice(0)});
          await dlg({titel:'PDF gespeichert – bitte umbenennen',text:'Diese App erlaubt nur bestimmte Dateitypen. Der Bericht wurde deshalb als «'+name+'.txt» gespeichert.\n\nIn den Dateien die Endung «.txt» entfernen – danach öffnet sich die Datei als normales PDF.',ok:'Verstanden',abbrechen:'Schliessen'});
          return true;}
        catch(x){toast('Speichern nicht möglich: '+((x&&x.code)||'unbekannt'));return false;}}
      toast('Speichern nicht möglich: '+((e&&e.code)||'unbekannt'));return false;}}
  if(await pdfSenden(name,bytes))return true;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('PDF erstellt: '+name);return true;}

function pdfKopf(d,titel,unterzeile,rechtsOben,rechtsWert,ampel){
  d.text(titel,{size:15,bold:true,w:d.breite-120,nach:1});

        mg.map(p=>{const mm=DB.massnahmen.find(x=>x.punkt===p.id);
          let stopp=p.arbeitsstopp;
          if(p.arbeitsstopp==='Ja'&&mm&&mm.stoppSeit){const ende=mm.wiederaufnahmeAm?new Date(mm.wiederaufnahmeAm):new Date();
            const h=Math.max(0,Math.round((ende-new Date(mm.stoppSeit))/36e5));
            stopp+=mm.wiederaufnahmeAm?'\nStopp '+h+' h, Wiederaufnahme '+fmtDT(mm.wiederaufnahmeAm)+' durch '+(mm.wiederaufnahmeDurch||''):'\nlaeuft seit '+h+' h';}
          return [ampel(p),p.objekt+'\n'+p.objektgruppe+(p.regel?' · Regel '+p.regel:'')+(p.recht?'\n'+p.recht:''),
            p.mangel+(p.betroffene?'\nBetroffene: '+p.betroffene:''),
            p.massnahme+(p.sofort?'\nSofort: '+p.sofort:'')+(p.stoppBegruendung?'\nKein Stopp, weil: '+p.stoppBegruendung:'')+'\nSTOP: '+p.stopArt,
            p.prio,stopp+(p.freigabe?'\nFreigabe: '+p.freigabe:''),p.zustaendig,fmtD(p.termin),p.nk];}),
        [.85,2.5,2.9,2.9,.85,1.5,1.35,1.15,.6]);
      for(const p of mg){if(p.fotos&&p.fotos.length){d.text('Fotos zu «'+p.objekt+'»',{size:8,bold:true,nach:2});d.bildReihe(p.fotos,110);}}}
    else d.text('Keine Mängel festgestellt.');
    if(vb.length){d.titel('Positivbefunde');
      vb.forEach(p=>d.text('• '+p.objekt+(p.bem?' – '+p.bem:''),{size:9,nach:1}));}}
  d.titel('Bestätigung');
  const sig=await alsJpeg(k.sig);
  const yb=d.y;
  d.textAn('Prüfer/in: '+k.pruefer,d.links,yb-10,9,false);
  if(sig)d.bildAn(sig,d.links,yb-70,150);
  d.rechteck(d.links,yb-74,150,.7,.2);
  d.textAn(k.abgeschlossenAm?'Abgeschlossen am '+fmtDT(k.abgeschlossenAm):'Unterschrift',d.links,yb-86,7,false,'0.45 0.45 0.45');
  d.textAn('Polier / Bauführer (Kenntnisnahme)',d.links+230,yb-10,9,false);
  d.rechteck(d.links+230,yb-74,150,.7,.2);
  d.y=yb-96;
  if(mitAnhang&&!e){
    d.neueSeite();
    d.text('Anhang – alle Prüfpunkte',{size:13,bold:true,nach:4});
    d.tabelle(['Bereich','Objekt','Prüffrage','Grundlage','Status','Bemerkung'],
      gs.reduce((a,g)=>a.concat(g.punkte.map(p=>[g.titel.replace(/ – .*/,''),p.objekt,p.frage,p.recht||'',p.status,p.bem||''])),[]),
      [1.4,1.8,4.4,1.8,1,1.6]);}
  d.fuss('Grundlagen: Suva – 10 lebenswichtige Regeln Verkehrsweg- und Tiefbau · Suva-Checklisten · BauAV · VUV · EKAS 6508. Ampel: OK/vorbildlich = Grün · Mangel Niedrig/Mittel = Gelb · Hoch = Orange · Kritisch oder Arbeitsstopp = Rot. Fristen: Kritisch sofort · Hoch 3 Arbeitstage · Mittel 14 Tage · Niedrig 30 Tage.');
  await pdfSpeichern((k.nr||'Bericht')+'_'+(b.name||'').replace(/[^\wäöüÄÖÜ-]+/g,'_').slice(0,28)+'.pdf',d);}

async function pdfMassnahmen(f){
  let ms=DB.massnahmen.filter(m=>f==='alle'||(f==='nk'?m.nkStatus==='Offen':f==='ueb'?ueberfaellig(m):f==='stopp'?(m.arbeitsstopp==='Ja'&&!m.wiederaufnahmeAm):f==='krit'?(m.status!=='Erledigt'&&(m.prio==='Kritisch'||m.arbeitsstopp==='Ja')):m.status!=='Erledigt'));
  ms.sort((a,b)=>(a.termin||'9').localeCompare(b.termin||'9'));
  const titel={offen:'offen',krit:'kritisch',stopp:'Arbeitsstopp aktiv',ueb:'überfällig',nk:'Wirksamkeitskontrolle offen',alle:'alle'}[f]||'offen';
  const d=PDFDoc.doc({quer:true,kopf:(DB.cfg&&DB.cfg.firma)||'Sicherheitsaudit Grossbaustelle Tiefbau'});
  pdfKopf(d,'Massnahmenliste – '+titel,'Stand '+fmtD(today())+' · '+ms.length+' Einträge');
  d.tabelle(['Baustelle','Quelle','Objekt','Mangel','Massnahme','Grundlage','Prio','Stopp','Zuständig','Termin','Status','WK'],
    ms.map(m=>[bs(m.baustelle).name,ARTK[m.kontrollart]||'',m.objekt,m.mangel,m.massnahme,m.recht||'',m.prio,m.arbeitsstopp,
      m.zustaendig||'',fmtD(m.termin)+(ueberfaellig(m)?' !':''),m.status,m.nkStatus||m.nk||'']),
    [1.7,1,1.7,3.2,3.2,1.6,.9,.7,1.3,1.1,1,.9]);
  d.fuss('Fristen: Kritisch sofort · Hoch 3 Arbeitstage · Mittel 14 Tage · Niedrig 30 Tage. WK = Wirksamkeitskontrolle. «!» = überfällig.');
  await pdfSpeichern('Massnahmen_'+titel.replace(/[^\wäöü]+/g,'_')+'_'+today()+'.pdf',d);}

async function pdfInstruktion(id){
  const r=(DB.instruktionen||[]).find(x=>x.id===id);if(!r)return;
  const ps=r.teilnehmer.map(i=>DB.personen.find(p=>p.id===i)).filter(Boolean);
  const d=PDFDoc.doc({kopf:(DB.cfg&&DB.cfg.firma)||'Sicherheitsaudit Grossbaustelle Tiefbau'});
  pdfKopf(d,'Instruktionsnachweis – '+r.thema,r.nr+' · '+fmtD(r.datum)+(r.ort?' · '+r.ort:''),'Teilnehmende',String(ps.length));
  d.kv([['Instruiert durch',r.durch||'–'],['Dauer',(r.minuten||'–')+' Minuten'],
    ['Nächste Instruktion',fmtD(faelligAm(r.datum,+cfg('instrIntervall',12)))]],3);
  if(r.inhalt){d.titel('Inhalt');d.text(r.inhalt);}
  d.titel('Teilnehmerliste');
  d.tabelle(['#','Name','Funktion','Firma','Unterschrift'],
    ps.map((p,i)=>[String(i+1),p.name,p.funktion,p.firma||'eigen','']),[.4,2.2,1.8,1.8,3.4],{size:8.5});
  d.abstand(10);
  const yb=d.y;
  d.textAn('Instruktion durchgeführt durch: '+(r.durch||''),d.links,yb-10,9,false);
  d.rechteck(d.links,yb-64,170,.7,.2);
  d.y=yb-78;
  d.fuss('Mit der Unterschrift bestätigen die Teilnehmenden, dass sie die Instruktion verstanden haben und die Regeln anwenden. Grundlage: VUV Art. 6, EKAS 6508, Suva – 10 lebenswichtige Regeln. Wiederholung alle '+cfg('instrIntervall',12)+' Monate.');
  await pdfSpeichern((r.nr||'Instruktion')+'.pdf',d);}

async function pdfAushang(bid){
  const b=DB.baustellen.find(x=>x.id===bid)||DB.baustellen[0];if(!b)return;
  const c=DB.cfg||{};
  const d=PDFDoc.doc({mt:40,mb:40});
  d.text(c.firma||'Sicherheitsaudit Tiefbau',{size:9,align:'mitte',farbe:'0.45 0.45 0.45',nach:2});
  d.text('Gefahr gesehen? Melden!',{size:30,bold:true,align:'mitte',nach:2});
  d.text('Baustelle '+b.name+(b.nr?' · '+b.nr:'')+(b.ort?' · '+b.ort:''),{size:12,align:'mitte',nach:6});
  d.linie(1.6,.15);
  d.abstand(6);
  d.hinweis('STOPP bei Gefahr – Arbeit einstellen · Gefahr beheben · weiterarbeiten');
  const felder=[['1','Meldung per E-Mail',mailVorlage(b),'Code scannen – die E-Mail öffnet sich mit fertiger Vorlage. Absenden genügt.',c.sibeMail||'– keine Adresse hinterlegt –'],
    ['2','Meldung im Formular',meldeLink(b.id),'Code scannen – Formular mit Foto direkt auf dem Handy ausfüllen.','Ohne Anmeldung, anonym möglich'],
    ['3','Akute Gefahr: anrufen','tel:'+((c.sibeTel||'').replace(/\s/g,'')||'+41000000000'),'Sofort anrufen, nicht schreiben. Danach Bereich sichern.',(c.sibeName||'Sicherheitsbeauftragter')+' · '+(c.sibeTel||'–')]];
  const sp=(d.breite-24)/3;
  const yTop=d.y;
  let hoehe=0;
  felder.forEach((fdl,i)=>{
    const x=d.links+i*(sp+12);
    let yy=yTop-6;
    d.textAn(fdl[0]+' · '+fdl[1],x,yy-11,10.5,true);yy-=22;
    const seite=Math.min(sp-6,168);
    try{const m=QR.encode(fdl[2]);const n=m.length,q=4,mod=seite/(n+2*q);
      d.rechteck(x+(sp-seite)/2,yy-seite,seite,seite,1);
      for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(m[r][cc])
        d.rechteck(x+(sp-seite)/2+(cc+q)*mod,yy-seite+(n-1-r+q)*mod,mod+.2,mod+.2,0);
    }catch(e){d.textAn('QR zu lang',x,yy-20,9,false);}
    yy-=seite+12;
    d.umbruchVon(fdl[3],8.5,false,sp).forEach(z=>{d.textAn(z,x,yy,8.5,false);yy-=11;});
    yy-=2;
    d.umbruchVon(fdl[4],8,false,sp).forEach(z=>{d.textAn(z,x,yy,8,false,'0.45 0.45 0.45');yy-=10;});
    hoehe=Math.max(hoehe,yTop-yy);});
  d.y=yTop-hoehe-14;
  d.linie(.6,.75);
  d.abstand(4);
  const yS=d.y;
  d.textAn('Was melden?',d.links,yS-10,9.5,true);
  ['Alles, was jemanden verletzen kann','Beinaheunfälle – auch wenn nichts passiert ist','Fehlende oder defekte Schutzeinrichtungen','Gute Lösungen und Verbesserungsideen']
    .forEach((t,i)=>d.textAn('• '+t,d.links,yS-26-i*13,8.5,false));
  d.textAn('Was passiert danach?',d.links+d.breite/2,yS-10,9.5,true);
  ['Der SiBe erfasst die Meldung im Kontrollprogramm','Es entsteht eine Massnahme mit Termin und Zuständigem','Der Melder erhält eine Rückmeldung, wenn er den Namen angibt','Meldungen haben nie Nachteile zur Folge (Sicherheits-Charta)']
    .forEach((t,i)=>d.textAn('• '+t,d.links+d.breite/2,yS-26-i*13,8.5,false));
  d.y=yS-84;
  d.fuss('Aushang erstellt '+fmtD(today())+' · Bitte beim Bauzugang, im Aufenthaltscontainer und beim Magazin aushängen · Grundlage: Suva – 10 lebenswichtige Regeln, Sicherheits-Charta');
  await pdfSpeichern('QR_Aushang_'+(b.name||'Baustelle').replace(/[^\wäöüÄÖÜ-]+/g,'_').slice(0,28)+'.pdf',d);}

async function pdfAuftrag(name){

    .sort((a,c)=>(a.termin||'9').localeCompare(c.termin||'9'));
  if(!ms.length){toast('Für «'+name+'» ist nichts offen.');return;}
  const d=PDFDoc.doc({kopf:(DB.cfg&&DB.cfg.firma)||'Sicherheitsaudit Grossbaustelle Tiefbau'});
  pdfKopf(d,'Auftrag – '+name,'Stand '+fmtD(today())+' · '+ms.length+' offene Punkte'+(ms.filter(ueberfaellig).length?' · '+ms.filter(ueberfaellig).length+' überfällig':''));
  d.text('Bitte erledigen und auf diesem Blatt abzeichnen. Bei kritischen Punkten oder Arbeitsstopp zuerst den Bauführer informieren.',{size:9,farbe:'0.35 0.35 0.35',nach:6});
  d.tabelle(['Baustelle','Wo / was','Was ist zu tun','Prio','Bis wann','Erledigt am','Visum'],
    ms.map(m=>[bs(m.baustelle).name,m.objekt+(m.mangel?'\n'+m.mangel:''),m.massnahme+(m.sofort?'\nSofort: '+m.sofort:''),
      m.prio+(m.arbeitsstopp==='Ja'?'\nARBEITSSTOPP':''),fmtD(m.termin)+(ueberfaellig(m)?'\nüberfällig':''),'','']),
    [1.5,3,3.4,1,1.1,1.2,1]);
  d.abstand(8);
  const yb=d.y;
  d.textAn('Zurück an: '+(DB.cfg&&DB.cfg.sibeName?DB.cfg.sibeName:'Bauführer / SiBe'),d.links,yb-10,9,false);
  d.textAn('Unterschrift '+name,d.links+300,yb-10,9,false);
  d.rechteck(d.links+300,yb-58,150,.7,.2);
  d.y=yb-72;
  d.fuss('Erledigte Punkte werden im Programm nachgeführt; bei Punkten mit Wirksamkeitskontrolle prüft der Bauführer die Wirkung vor Ort nach.');
  await pdfSpeichern('Auftrag_'+name.replace(/[^\wäöüÄÖÜ-]+/g,'_')+'_'+today()+'.pdf',d);}

function auftragMail(name){
  const ms=DB.massnahmen.filter(m=>m.status!=='Erledigt'&&(m.zustaendig||'')===name)
    .sort((a,c)=>(a.termin||'9').localeCompare(c.termin||'9'));
  if(!ms.length){toast('Für «'+name+'» ist nichts offen.');return;}
  const p=DB.personen.find(x=>x.name===name);
  const txt=['Guten Tag '+name,'','Folgende Punkte sind offen:','',
    ...ms.map(m=>'- '+bs(m.baustelle).name+' · '+m.objekt+': '+m.massnahme+' (Priorität '+m.prio+', bis '+fmtD(m.termin)+(ueberfaellig(m)?' – überfällig':'')+')'),
    '','Bitte kurz melden, sobald erledigt.','',(DB.cfg&&DB.cfg.sibeName)||''].join('\n');
  location.href='mailto:'+((p&&p.mail)||'')+'?subject='+encodeURIComponent('Offene Sicherheitspunkte – '+name)+'&body='+encodeURIComponent(txt);}

    ok:'Mit Anhang',abbrechen:'Ohne Anhang'});
