<style>:root{
  --bg:#F4F3EF;--surface:#FFFFFF;--surface2:#ECEAE4;--line:#D8D5CC;--ink:#1D2229;--ink2:#5B6470;--ink3:#8A9099;
  --accent:#2A5D8C;--accent-ink:#FFFFFF;--accent-soft:#E1EBF5;
  --ok:#2E8B57;--ok-soft:#DFF1E6;--warn:#D7A100;--warn-soft:#FBF1C7;--orange:#E0731D;--orange-soft:#FBE5D2;--crit:#C4302B;--crit-soft:#F8DDDB;--grey:#9AA0A8;--grey-soft:#E9EBEE;
  --radius:10px;--shadow:0 1px 2px rgba(20,25,30,.06),0 4px 14px rgba(20,25,30,.05);
  --fd:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;--fb:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15191E;--surface:#1E242B;--surface2:#272E37;--line:#38414C;--ink:#ECEEF0;--ink2:#A9B1BB;--ink3:#7C8591;
  --accent:#6FA3D6;--accent-ink:#0F1A26;--accent-soft:#24384D;
  --ok-soft:#1E3A2B;--warn-soft:#3E3614;--orange-soft:#46290F;--crit-soft:#4A1F1D;--grey-soft:#2C333C;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#15191E;--surface:#1E242B;--surface2:#272E37;--line:#38414C;--ink:#ECEEF0;--ink2:#A9B1BB;--ink3:#7C8591;
  --accent:#6FA3D6;--accent-ink:#0F1A26;--accent-soft:#24384D;
  --ok-soft:#1E3A2B;--warn-soft:#3E3614;--orange-soft:#46290F;--crit-soft:#4A1F1D;--grey-soft:#2C333C;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.15;text-wrap:balance;font-weight:600}
h1{font-size:30px}h2{font-size:24px}h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.2px;padding:4px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand small{display:block;font-weight:500;color:var(--ink2);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:8px;font-size:16px;color:var(--ink)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .n{margin-left:auto;font-size:13px;background:var(--crit);color:#fff;border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums}
.nav .ico{width:22px;text-align:center;font-size:18px}
.app>div{min-width:0}.main{padding:22px 28px 90px;max-width:1100px;width:100%;min-width:0}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 10px}
  .topbar button{flex:0 0 auto;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:15px;white-space:nowrap}
  .topbar button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .main{padding:16px 14px 90px}
}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--ink2)}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-height:110px;box-shadow:var(--shadow)}
.tile:active{transform:scale(.99)}
.tile .t{font-family:var(--fd);font-size:21px;font-weight:600}

      const bildRes=bilder.map((b,i)=>'/'+b.name+' '+(erstesBild+i)+' 0 R').join(' ');
      pages.forEach((p,i)=>obj(erstePage+i,'<< /Type /Page /Parent '+N_PAGES+' 0 R /MediaBox [0 0 '+PW.toFixed(2)+' '+PH.toFixed(2)+'] /Resources << /Font << /F1 '+N_F1+' 0 R /F2 '+N_F2+' 0 R >> '+(bilder.length?'/XObject << '+bildRes+' >>':'')+' >> /Contents '+(inhaltAb+i)+' 0 R >>'));
      pages.forEach((p,i)=>{const s=p.ops.join('\n');obj(inhaltAb+i,'<< /Length '+s.length+' >>',s);});
      const xref=laenge;
      const anzahl=inhaltAb+pages.length;
      let x='xref\n0 '+anzahl+'\n0000000000 65535 f \n';
      for(let n=1;n<anzahl;n++)x+=String(off[n]||0).padStart(10,'0')+' 00000 n \n';
      push(x);

      const alles=new Uint8Array(laenge);let p2=0;teile.forEach(t=>{alles.set(t,p2);p2+=t.length;});
      return alles;}

/* ---------- Fachlogik ---------- */
function ampel(p){
  if(p.status==='OK'||p.status==='Vorbildlich')return 'Grün';
  if(p.status!=='Mangel')return 'Grau';
  if(p.arbeitsstopp==='Ja'||p.prio==='Kritisch')return 'Rot';
  if(p.prio==='Hoch')return 'Orange';
  return 'Gelb';
}
function ampelGruppe(ps){if(ps.some(p=>ampel(p)==='Rot'))return 'Rot';if(ps.some(p=>['Orange','Gelb'].includes(ampel(p))))return 'Gelb';if(ps.every(p=>p.status==='Nicht geprüft'))return 'Grau';return 'Grün';}
function gesamt(k){if(k.art==='Ereignis')return (k.ereignis&&k.ereignis.schwere.startsWith('Unfall'))?'Rot':'Gelb';return ampelGruppe(DB.punkte.filter(p=>p.kontrolle===k.id));}
function fristFuer(prio){return addDays(today(),FRIST[prio]??14);}
function pflichtFehler(p){
  const e=[];if(p.status!=='Mangel')return e;
  if(!p.mangel)e.push('Mangelbeschreibung');if(!p.prio)e.push('Priorität');if(!p.massnahme)e.push('Massnahme');if(!p.zustaendig)e.push('Zuständig');if(!p.termin)e.push('Termin');
  if(p.prio==='Kritisch'||p.arbeitsstopp==='Ja'){if(!p.sofort)e.push('Sofortmassnahme');if(!(p.fotos&&p.fotos.length))e.push('Foto');if(!p.freigabe)e.push('Freigabe durch');}
  if(p.stoppVorschlag==='Ja'&&p.arbeitsstopp!=='Ja'&&!p.stoppBegruendung)e.push('Begründung, warum kein Arbeitsstopp');
  return e;
}
function syncMassnahme(p){
  const k=DB.kontrollen.find(x=>x.id===p.kontrolle);let m=DB.massnahmen.find(m=>m.punkt===p.id);
  if(p.status==='Mangel'){
    if(!m){m={id:uid(),punkt:p.id,status:'Offen',nkStatus:'',nkDatum:'',nkDurch:'',erledigt:'',fotosNach:[],wirksam:''};DB.massnahmen.push(m);}
    Object.assign(m,{baustelle:k.baustelle,kontrollart:k.art,kategorie:p.objektgruppe,objekt:p.objekt,regel:p.regel,recht:p.recht,mangel:p.mangel,massnahme:p.massnahme,sofort:p.sofort,prio:p.prio,arbeitsstopp:p.arbeitsstopp,zustaendig:p.zustaendig,betroffene:p.betroffene,termin:p.termin,nk:p.nk,stop:p.stopArt,erstellt:m.erstellt||new Date().toISOString(),stoppSeit:p.arbeitsstopp==='Ja'?(m.stoppSeit||new Date().toISOString()):'',wiederaufnahmeAm:p.wiederaufnahmeAm||m.wiederaufnahmeAm||'',wiederaufnahmeDurch:p.wiederaufnahmeDurch||m.wiederaufnahmeDurch||''});
  }else if(m&&m.status==='Offen'){DB.massnahmen=DB.massnahmen.filter(x=>x!==m);}
}
function ueberfaellig(m){return m.status!=='Erledigt'&&m.termin&&m.termin<today();}
function letzteKontrolle(bsid,art){const ks=DB.kontrollen.filter(k=>k.baustelle===bsid&&k.art===art&&k.abgeschlossen).sort((a,b)=>b.datum.localeCompare(a.datum));return ks[0]?ks[0].datum.slice(0,10):'';}
function kontrollenFaellig(){const out=[];DB.baustellen.filter(b=>b.status==='Aktiv').forEach(b=>{Object.entries(RHYTHMUS).forEach(([art,tage])=>{const l=letzteKontrolle(b.id,art);const due=l?daysBetween(l,today())>=tage:true;if(due)out.push({b,art,letzte:l,tage:l?daysBetween(l,today()):null});});});return out;}
function regelGruppen(ps){const gs=[...new Set(ps.map(p=>p.regel))].sort((a,b)=>(a===0?99:a)-(b===0?99:b));return gs.map(r=>({key:r,kurz:r||'+',titel:(r?`Regel ${r} – `:'')+REG[String(r)],punkte:ps.filter(p=>p.regel===r)}));}
function objGruppen(ps){return [...new Set(ps.map(p=>p.objektgruppe))].map(g=>({key:g,titel:g,punkte:ps.filter(p=>p.objektgruppe===g)}));}
function gruppen(k,ps){
  if(k.art!=='Tagescheck'&&k.art!=='Rundgang')return objGruppen(ps);
  const gs=regelGruppen(ps.filter(p=>!p.geraet));
  const byG={};ps.filter(p=>p.geraet).forEach(p=>{(byG[p.geraet]=byG[p.geraet]||[]).push(p);});
  Object.keys(byG).forEach((id,ix)=>{const m=DB.maschinen.find(x=>x.id===id);
    gs.push({key:'G'+id,kurz:id==='ANSCHLAG'?'⛓':'⚙'+(ix+1),titel:id==='ANSCHLAG'?'Anschlagmittel, Ketten und Schlingen':('Gerät: '+((m||{}).name||'Maschine')+((m||{}).inv?' · '+m.inv:'')),punkte:byG[id]});});
  return gs;}
function kurzTitel(t){return t.replace(/^Regel \d+ – /,'');}

function checkBediener(){const m=DB.maschinen.find(x=>x.id===document.getElementById('f_m').value);const p=DB.personen.find(x=>x.id===document.getElementById('f_bed').value);const h=document.getElementById('bedHint');if(!m||!p){h.textContent='';return;}
  const out=[];

  if(need){const ok=(p.ausweise||[]).some(a=>a.startsWith(need));out.push(ok?`<span class="ok-c">✓ Berechtigung «${need}» vorhanden</span>`:`<span class="crit-c">⚠ Kein Nachweis «${need}» hinterlegt – Einsatz nur mit Nachweis (Regel 5)</span>`);}
  const kat=MASCH_FAHR[m.typ];
  if(kat){const f=p.fahr||[];const ok=f.includes(kat)||(kat==='B'&&f.some(x=>['C','C1','CE','C1E','D1'].includes(x)));
    out.push(ok?`<span class="ok-c">✓ Fahrausweis Kategorie ${kat} vorhanden</span>`:`<span class="crit-c">⚠ Fahrausweis Kategorie ${kat} fehlt</span>`);
    if(p.fahrBis&&p.fahrBis<today())out.push('<span class="crit-c">⚠ Führerausweis abgelaufen ('+fmtD(p.fahrBis)+')</span>');
    if(['C','C1','CE','C1E','D1'].includes(kat)&&p.czvBis&&p.czvBis<today())out.push('<span class="crit-c">⚠ CZV abgelaufen ('+fmtD(p.czvBis)+')</span>');}
  h.innerHTML=out.join('<br>');}
function startKontrolle(){
  const art=document.getElementById('f_art').value,bsid=document.getElementById('f_bs').value,pr=document.getElementById('f_pr').value.trim();
  if(!bsid||!pr){toast('Baustelle und Prüfer sind Pflicht.');return;}
  localStorage.setItem('suva_user',pr);DB.seq++;
  const modeEl=document.querySelector('input[name=f_mode]:checked');
  const k={id:uid(),nr:`K-${new Date().getFullYear()}-${String(DB.seq).padStart(4,'0')}`,art,baustelle:bsid,datum:document.getElementById('f_dt').value,pruefer:pr,begleit:document.getElementById('f_bg').value,zone:document.getElementById('f_zone').value,wetter:document.getElementById('f_w').value,maschine:art==='Geraetepruefung'?document.getElementById('f_m').value:'',bediener:art==='Geraetepruefung'?document.getElementById('f_bed').value:'',fazit:'',gespraech:'Nein',teilnehmer:'',abgeschlossen:false,sig:'',mode:modeEl?modeEl.value:'list',step:0,bereich:{}};
  let vorl=STAMM.pruefpunkte.filter(p=>p.Typ===art);
  if(art==='Geraetepruefung'){const m=DB.maschinen.find(x=>x.id===k.maschine);vorl=vorl.filter(p=>p.Objektgruppe===m.typ);}
  if(art==='Audit Tiefbau'){const sel=[...document.querySelectorAll('#f_themen input:checked')].map(i=>i.value);if(sel.length)vorl=vorl.filter(p=>sel.includes(p.Objektgruppe));}
  const umfEl=document.querySelector('input[name=f_umf]:checked');k.umfang=(art==='Rundgang'&&umfEl)?umfEl.value:'kompakt';
  DB.kontrollen.push(k);
  vorl.forEach(v=>DB.punkte.push({id:uid(),kontrolle:k.id,vorlage:v.ID,objektgruppe:v.Objektgruppe,objekt:v.Objekt,soll:v.KurzSoll,frage:v.Prueffrage,risikotyp:v.Risikotyp,regel:v.Regel,recht:v.Recht,prioStd:v.Prioritaet,stoppVorschlag:v.Arbeitsstopp,stopArt:v.STOP,status:'Nicht geprüft',prio:v.Prioritaet,arbeitsstopp:'Nein',mangel:'',sofort:'',massnahme:'',betroffene:'',zustaendig:'',termin:'',terminAuto:true,nk:v.Arbeitsstopp==='Ja'?'Ja':'Nein',fotos:[],freigabe:'',stoppBegruendung:'',bem:'',wiederaufnahmeAm:'',wiederaufnahmeDurch:''}));
  if(art==='Tagescheck'){
    [...document.querySelectorAll('.m_sel:checked')].map(i=>i.value).forEach(mid=>{
      const mm=DB.maschinen.find(x=>x.id===mid);if(!mm)return;
      tagesSet(mm.typ).forEach(v=>{const pp=neuerPunkt(k,v);pp.geraet=mm.id;pp.objekt=mm.name+' – '+v.Objekt;DB.punkte.push(pp);});});
  }
  if(k.umfang==='voll'){
    DB.maschinen.filter(m=>m.baustelle===bsid).forEach(m=>{
      STAMM.pruefpunkte.filter(v=>v.Typ==='Geraetepruefung'&&v.Objektgruppe===m.typ).forEach(v=>{
        const p=neuerPunkt(k,v);p.geraet=m.id;p.objekt=m.name+' – '+v.Objekt;DB.punkte.push(p);});});
    STAMM.pruefpunkte.filter(v=>v.Typ==='Geraetepruefung'&&v.Objektgruppe==='Anschlagmittel / Ketten / Schlingen').forEach(v=>{
      const p=neuerPunkt(k,v);p.geraet='ANSCHLAG';DB.punkte.push(p);});
  }
  save();go('pruefen',{id:k.id});
}
function tagesSet(typ){
  const alle=STAMM.pruefpunkte.filter(v=>v.Typ==='Geraetepruefung'&&v.Objektgruppe===typ);
  const rang={'Kritisch':0,'Hoch':1,'Mittel':2,'Niedrig':3};
  return alle.slice().sort((a,b)=>(a.Arbeitsstopp==='Ja'?0:1)-(b.Arbeitsstopp==='Ja'?0:1)||(rang[a.Prioritaet]??9)-(rang[b.Prioritaet]??9)||a.Sort-b.Sort).slice(0,4);}
function neuerPunkt(k,v){return {id:uid(),kontrolle:k.id,vorlage:v.ID,objektgruppe:v.Objektgruppe,objekt:v.Objekt,soll:v.KurzSoll,frage:v.Prueffrage,risikotyp:v.Risikotyp,regel:v.Regel,recht:v.Recht,prioStd:v.Prioritaet,stoppVorschlag:v.Arbeitsstopp,stopArt:v.STOP,status:'Nicht geprüft',prio:v.Prioritaet,arbeitsstopp:'Nein',mangel:'',sofort:'',massnahme:'',betroffene:'',zustaendig:'',termin:'',terminAuto:true,nk:v.Arbeitsstopp==='Ja'?'Ja':'Nein',fotos:[],freigabe:'',stoppBegruendung:'',bem:'',wiederaufnahmeAm:'',wiederaufnahmeDurch:''};}
S.pruefen=()=>{
  const k=DB.kontrollen.find(x=>x.id===route.id);if(!k)return S.start();
  const ps=DB.punkte.filter(p=>p.kontrolle===k.id);const gs=gruppen(k,ps);
  const done=ps.filter(p=>p.status!=='Nicht geprüft').length;const fehler=ps.flatMap(pflichtFehler);
  const m=k.maschine?DB.maschinen.find(x=>x.id===k.maschine):null;const bed=k.bediener?DB.personen.find(x=>x.id===k.bediener):null;
  const schritte=(k.mode==='steps'&&mitVorbereitung(k))?[{vor:true,key:'VOR',kurz:'i',titel:'Vorbereitung – seit der letzten Kontrolle',punkte:[]}].concat(gs):gs;
  const abschluss=k.abgeschlossen
    ? `<button class="btn sm p" onclick="go('bericht',{id:'${k.id}'})">Bericht / PDF</button>`
    : `<button class="btn sm p" ${fehler.length?'disabled title="Zuerst die fehlenden Pflichtangaben ergänzen"':''} onclick="go('abschluss',{id:'${k.id}'})">Abschliessen</button>`;
  const head=`<div class="head"><div><div class="eyebrow">${esc(k.nr)} · ${esc(ARTEN[k.art])}</div><h1>${esc(bs(k.baustelle).name)}${m?' · '+esc(m.name):''}</h1><p>${fmtDT(k.datum)} · ${esc(k.pruefer)}${k.zone?' · '+esc(k.zone):''} · ${esc(k.wetter)}${bed?' · Bediener: '+esc(bed.name):''}</p></div>
  <div class="row"><span class="pill b">${done}/${ps.length} geprüft</span><span class="dot ${gesamt(k)}"></span>${k.abgeschlossen?'<span class="pill g">Abgeschlossen</span>':''}${abschluss}${!k.abgeschlossen&&gs.length>1?`<button class="btn sm" onclick="toggleMode('${k.id}')">${k.mode==='steps'?'Als Gesamtliste':'Schrittweise'}</button>`:''}<button class="btn sm ghost crit-c" onclick="delKontrolle('${k.id}')">Löschen</button></div></div>`;
  const foot=`<div class="card mt"><div class="row sp"><div><b>${fehler.length?`${fehler.length} Pflichtangaben fehlen`:'Alle Pflichtangaben vorhanden'}</b><div class="small muted">${done<ps.length?`${ps.length-done} Punkte noch offen (im Bericht als «Nicht geprüft» ausgewiesen).`:''}</div></div>
  <div class="row">${k.abgeschlossen?`<button class="btn p" onclick="go('bericht',{id:'${k.id}'})">Bericht / PDF</button>`:`<button class="btn p" ${fehler.length?'disabled':''} onclick="go('abschluss',{id:'${k.id}'})">Abschliessen →</button>`}<button class="btn ghost" onclick="go('kontrollen')">Später weiter</button></div></div></div>`;

  if(k.mode==='steps'&&!k.abgeschlossen){
    const i=Math.min(k.step||0,schritte.length-1);const g=schritte[i];
    const leiste=`<div class="steps">${schritte.map((x,j)=>`<button class="step ${j===i?'cur':''} ${x.vor?'':ampelGruppe(x.punkte)}" onclick="setStep('${k.id}',${j})" title="${esc(x.titel)}"><b>${x.vor?'i':(x.kurz||x.key||'+')}</b><span>${x.vor?'Start':x.punkte.filter(p=>p.status!=='Nicht geprüft').length+'/'+x.punkte.length}</span></button>`).join('')}</div>`;
    if(g.vor)return head+leiste+vorbereitungKarte(k)+
      `<div class="card"><div class="row sp"><span class="small muted">Schritt 1 von ${schritte.length} · Übersicht, hier wird nichts bewertet</span>
      <button class="btn p" onclick="setStep('${k.id}',1)">Kontrolle beginnen: ${esc(kurzTitel(schritte[1].titel))} ›</button></div></div>${DL()}`;
    const ga=ampelGruppe(g.punkte);const gd=g.punkte.filter(p=>p.status!=='Nicht geprüft').length;
    const r=STAMM.regeln.find(x=>x.Nr===g.key);const ber=k.bereich[g.key]||{};
    const wo=[...new Set(g.punkte.map(p=>p.objektgruppe))].join(' · ');
    const worauf=[...new Set(g.punkte.map(p=>p.objekt))].slice(0,7).join(' · ');
    const offene=offeneMassnahmenFuer(k,g);
    const letzter=i<schritte.length-1;
    return head+leiste+
    `<div class="card mb stephead"><div class="row sp"><div><div class="eyebrow">Schritt ${i+1} von ${schritte.length}</div><h2>${esc(g.titel)}</h2></div>
      <div class="row"><span class="dot ${ga}" style="width:18px;height:18px"></span><span class="pill b">${gd}/${g.punkte.length}</span></div></div>
      <div class="fuehrung"><div><b>Wo schaust du hin</b><span>${esc(wo)}</span></div><div><b>Worauf achtest du</b><span>${esc(worauf)}</span></div><div><b>Bei Gefahr</b><span>STOPP – Arbeit einstellen, Bereich sichern, Vorgesetzten informieren.</span></div></div>
      ${r?`<p class="small muted mt">Vorgesetzte: «${esc(r.Vorgesetzter)}»</p>`:''}</div>
    ${offene.length?`<div class="card mb wiedervorlage"><h3>Aus früheren Kontrollen noch offen (${offene.length})</h3>
      <p class="small muted">Beim Vorbeigehen gleich prüfen – das ist die Wirksamkeitskontrolle.</p>
      ${offene.map(mm=>`<div class="wv"><div><b>${esc(mm.objekt)}</b> – ${esc(mm.mangel)}<div class="small muted">${esc(mm.massnahme)} · ${esc(mm.zustaendig||'ohne Zuständigen')} · Termin ${fmtD(mm.termin)}${ueberfaellig(mm)?' <b class="crit-c">überfällig</b>':''}</div></div>
        <div class="row"><button class="btn sm p" onclick="wvErledigt('${mm.id}')">erledigt</button><button class="btn sm" onclick="toast('Bleibt offen.')">noch offen</button><button class="btn sm danger" onclick="nkErledigt('${mm.id}',false)">nicht wirksam</button></div></div>`).join('')}</div>`:''}
    ${istRundgangArtig(k)?`<details class="card mb bereich" ${ber.text?'open':''}><summary><b>Notiz zum Bereich</b> <span class="small muted">Beobachtung, Lob, mit wem besprochen ${ber.text?'· ausgefüllt':'· noch leer'}</span></summary>
      <div class="row mt"><span class="small muted">Bereichsampel (automatisch):</span><span class="dot ${ga}"></span><b>${ga}</b><span class="small muted">· ${g.punkte.filter(p=>p.status==='Mangel').length} Mängel · ${g.punkte.filter(p=>p.status==='Vorbildlich').length} vorbildlich</span></div>
      <div class="form mt"><label class="f full"><span>Was ist dir aufgefallen? (auch Lob)</span><textarea onchange="setBereich('${k.id}','${g.key}','text',this.value)">${esc(ber.text||'')}</textarea></label>
      <label class="f"><span>Besprochen mit</span><input list="dlPers" value="${esc(ber.mit||'')}" onchange="setBereich('${k.id}','${g.key}','mit',this.value)"></label>
      <label class="f"><span>Bereich bewertet</span><select onchange="setBereich('${k.id}','${g.key}','note',this.value)">${['','Gut – keine Auffälligkeiten','Akzeptabel – kleine Hinweise','Verbesserung nötig','Kritisch – sofort handeln'].map(o=>`<option ${ber.note===o?'selected':''}>${o}</option>`).join('')}</select></label></div></details>`:''}
    ${g.punkte.map(p=>ppCard(p,false,k)).join('')}
    <div class="card"><div class="row sp"><button class="btn" ${i===0?'disabled':''} onclick="setStep('${k.id}',${i-1})">‹ Zurück</button>
      <div class="row">${gd<g.punkte.length?`<button class="btn gross ok" onclick="schrittOK('${k.id}','${g.key}',${i})">Alles in Ordnung – weiter ›</button>`:(letzter?`<button class="btn p" onclick="setStep('${k.id}',${i+1})">Weiter: ${esc(kurzTitel(schritte[i+1].titel))} ›</button>`:`<button class="btn p" ${fehler.length?'disabled':''} onclick="go('abschluss',{id:'${k.id}'})">Kontrolle abschliessen →</button>`)}</div></div></div>
    ${!letzter?foot:''}${DL()}`;
  }
  return head+(k.abgeschlossen?'':`<div class="row mb"><button class="btn sm" onclick="alleOK('${k.id}')">Alle noch offenen auf OK</button><span class="small muted">Nur, wenn die Punkte tatsächlich vor Ort kontrolliert wurden.</span></div>`)+
  gs.map(g=>`<div class="grp"><span class="dot ${ampelGruppe(g.punkte)}"></span><h3>${esc(g.titel)}</h3><div class="ln"></div><span class="small muted">${g.punkte.filter(p=>p.status!=='Nicht geprüft').length}/${g.punkte.length}</span></div>${g.punkte.map(p=>ppCard(p,k.abgeschlossen,k)).join('')}${(k.bereich[g.key]||{}).text?`<div class="small muted" style="margin:-4px 0 10px 6px">Notiz: ${esc(k.bereich[g.key].text)}</div>`:''}`).join('')+foot+DL();
};
function mitVorbereitung(k){return k.art==='Rundgang'||k.art==='Audit Tiefbau';}
function istRundgangArtig(k){return k.art==='Rundgang'||k.art==='Audit Tiefbau';}
function offeneMassnahmenFuer(k,g){
  const eigene=DB.punkte.filter(p=>p.kontrolle===k.id).map(p=>p.id);
  return DB.massnahmen.filter(mm=>mm.baustelle===k.baustelle&&mm.status!=='Erledigt'&&!eigene.includes(mm.punkt)
    &&(String(mm.regel)===String(g.key)||mm.kategorie===g.key)).slice(0,6);}
function wvErledigt(id){const mm=DB.massnahmen.find(x=>x.id===id);if(!mm)return;
  mm.status='Erledigt';mm.erledigt=today();if(mm.nk==='Ja'&&mm.nkStatus!=='Erledigt')mm.nkStatus='Offen';save();render();
  toast('Als erledigt vermerkt'+(mm.nk==='Ja'?' – Wirksamkeitskontrolle bleibt offen.':'.'));}
function schrittOK(id,key,i){
  const k=DB.kontrollen.find(x=>x.id===id);
  gruppeOK(id,key);
  const gs=gruppen(k,DB.punkte.filter(p=>p.kontrolle===id));
  const n=(k.mode==='steps'&&mitVorbereitung(k))?gs.length+1:gs.length;
  if(i<n-1)setStep(id,i+1);}
function wiederholung(k,p){
  if(!p.vorlage)return 0;
  const frueher=DB.kontrollen.filter(x=>x.baustelle===k.baustelle&&x.id!==k.id&&(x.datum||'')<(k.datum||'')).map(x=>x.id);
  return DB.punkte.filter(x=>frueher.includes(x.kontrolle)&&x.vorlage===p.vorlage&&x.status==='Mangel').length;}
function vorbereitungKarte(k){
  const b=bs(k.baustelle);
  const letzte=DB.kontrollen.filter(x=>x.baustelle===k.baustelle&&x.art===k.art&&x.abgeschlossen&&x.id!==k.id).sort((a,c)=>c.datum.localeCompare(a.datum))[0];
  const seit=letzte?letzte.datum:'';
  const offen=DB.massnahmen.filter(m=>m.baustelle===k.baustelle&&m.status!=='Erledigt').sort((a,c)=>(a.termin||'9').localeCompare(c.termin||'9'));
  const ueb=offen.filter(ueberfaellig);
  const meld=(DB.meldungen||[]).filter(m=>m.baustelle===k.baustelle&&(!seit||m.eingang>seit)&&m.status!=='Ohne Massnahme erledigt');
  const ereig=DB.kontrollen.filter(x=>x.baustelle===k.baustelle&&x.art==='Ereignis'&&(!seit||x.datum>seit));
  const leute=DB.personen.filter(p=>p.baustelle===k.baustelle);
  const luecken=instrItems().filter(i=>i.art==='person'&&i.tage<0&&leute.some(p=>p.id===i.ref));
  const letzteMg=letzte?DB.punkte.filter(p=>p.kontrolle===letzte.id&&p.status==='Mangel'):[];
  const letzteErl=letzteMg.filter(p=>{const mm=DB.massnahmen.find(x=>x.punkt===p.id);return mm&&mm.status==='Erledigt';}).length;
  const notizen=letzte?Object.entries(letzte.bereich||{}).filter(([,v])=>v&&v.text):[];
  const box=(titel,inhalt,klasse)=>`<div class="vorb ${klasse||''}"><h4>${titel}</h4>${inhalt}</div>`;
  return `<div class="card mb"><h3>Vorbereitung – ${esc(b.name)}</h3>
  <p class="small muted">${letzte?`Letzte ${esc(ARTK[k.art]||k.art)}-Kontrolle am ${fmtD(letzte.datum)} durch ${esc(letzte.pruefer)} · ${letzteMg.length} Mängel, davon ${letzteErl} erledigt.`:'Erste Kontrolle dieser Art auf dieser Baustelle.'}</p>
  <div class="grid g2 mt">
  ${box('Offene Massnahmen ('+offen.length+(ueb.length?', '+ueb.length+' überfällig':'')+')',
     offen.length?`<ul>${offen.slice(0,6).map(m=>`<li>${ueberfaellig(m)?'<b class="crit-c">überfällig</b> · ':''}${esc(m.objekt)} – ${esc(m.massnahme).slice(0,70)} <span class="muted">(${esc(m.zustaendig||'offen')}, ${fmtD(m.termin)})</span></li>`).join('')}</ul>${offen.length>6?`<div class="small muted">… und ${offen.length-6} weitere</div>`:''}`:'<p class="small muted">Nichts offen.</p>',ueb.length?'warn':'')}
  ${box('Meldungen aus der Belegschaft ('+meld.length+')',
     meld.length?`<ul>${meld.slice(0,4).map(m=>`<li>${esc(m.dring)} · ${esc(m.text).slice(0,90)}</li>`).join('')}</ul>`:'<p class="small muted">Keine neuen Meldungen.</p>',meld.length?'warn':'')}
  ${box('Ereignisse seit der letzten Kontrolle ('+ereig.length+')',
     ereig.length?`<ul>${ereig.map(x=>`<li>${esc(x.ereignis?x.ereignis.schwere:'')} am ${fmtD(x.datum)} – ${esc((x.ereignis&&x.ereignis.hergang||'').slice(0,90))}</li>`).join('')}</ul>`:'<p class="small muted">Keine.</p>',ereig.length?'crit':'')}
  ${box('Instruktionen der Leute hier ('+luecken.length+' überfällig)',
     luecken.length?`<ul>${luecken.slice(0,5).map(i=>`<li>${esc(i.name)} – ${esc(i.was)}</li>`).join('')}</ul>`:'<p class="small muted">Alles aktuell.</p>',luecken.length?'warn':'')}
  </div>
  ${notizen.length?`<h4 class="mt">Notizen vom letzten Mal</h4><ul class="small">${notizen.map(([kk,v])=>`<li><b>${esc(kurzTitel(String(REG[kk]!==undefined?(kk!=='0'?'Regel '+kk+' – '+REG[kk]:REG[kk]):kk)))}:</b> ${esc(v.text)}${v.mit?' <span class="muted">(mit '+esc(v.mit)+')</span>':''}</li>`).join('')}</ul>`:''}
  </div>`;}
function toggleMode(id){const k=DB.kontrollen.find(x=>x.id===id);k.mode=k.mode==='steps'?'list':'steps';save();render();}
function setStep(id,i){const k=DB.kontrollen.find(x=>x.id===id);k.step=i;save();window.scrollTo(0,0);render();}
function setBereich(id,key,f,v){const k=DB.kontrollen.find(x=>x.id===id);k.bereich[key]=k.bereich[key]||{};k.bereich[key][f]=v;save();}
function gruppeOK(id,key){const k=DB.kontrollen.find(x=>x.id===id);const g=gruppen(k,DB.punkte.filter(p=>p.kontrolle===id)).find(x=>String(x.key)===String(key));if(!g)return;g.punkte.filter(p=>p.status==='Nicht geprüft').forEach(p=>p.status='OK');save();render();}
function alleOK(id){DB.punkte.filter(p=>p.kontrolle===id&&p.status==='Nicht geprüft').forEach(p=>p.status='OK');save();render();}
function ppCard(p,ro,k){
  const a=ampel(p);const err=pflichtFehler(p);const mangel=p.status==='Mangel';const krit=mangel&&(p.prio==='Kritisch'||p.arbeitsstopp==='Ja');
  const wdh=k?wiederholung(k,p):0;
  const bst=k?bs(k.baustelle):{};
  const vorschlag=[bst.polier,bst.bauleiter].filter(Boolean);
  return `<div class="pp ${a}" id="pp_${p.id}">
    <div class="q">${esc(p.frage)}</div>
    <div class="seg">${[['OK','OK','ok'],['Vorbildlich','★ vorbildlich','vb'],['Mangel','Mangel','mangel'],['Nicht geprüft','noch offen','np'],['Nicht relevant','nicht relevant','nr']].map(([s,l,c])=>`<button class="${p.status===s?'on '+c:''}" ${ro?'disabled':''} onclick="setP('${p.id}','status','${s}')">${l}</button>`).join('')}</div>
    <button class="ppmehr" onclick="this.parentNode.classList.toggle('offen')">Was gilt hier? ${esc(p.objekt)}${wdh?' · '+wdh+'× früher bemängelt':''}</button>
    <div class="ppinfo"><div class="soll">Soll: ${esc(p.soll)}${p.recht?` <span class="muted">· ${esc(p.recht)}</span>`:''}</div>
      <div class="meta"><span class="pill n">${esc(p.objektgruppe)}</span>${p.regel?`<span class="pill b">Regel ${p.regel}</span>`:''}<span class="pill ${p.prioStd==='Kritisch'?'r':p.prioStd==='Hoch'?'o':'y'}">Std. ${esc(p.prioStd)}</span>${p.stoppVorschlag==='Ja'?'<span class="pill r">Arbeitsstopp-Vorschlag</span>':''}<span class="pill n">STOP: ${esc(p.stopArt)}</span>${wdh?`<span class="pill o">Wiederholung: ${wdh}× auf dieser Baustelle</span>`:''}</div></div>
    ${mangel?`<div class="detail">
      ${krit?`<div class="stop mb">${p.arbeitsstopp==='Ja'?'ARBEITSSTOPP – Arbeiten sofort einstellen, Bereich sichern, melden. Wiederaufnahme nur nach dokumentierter Freigabe.':'Kritischer Mangel – Arbeitsstopp prüfen.'}</div>`:''}
      <div class="fotoreihe">${ro?'':`<label class="btn p">📷 Foto aufnehmen<input type="file" accept="image/*" capture="environment" hidden onchange="addFoto('${p.id}',this)"></label>`}
        <span class="small muted">${krit?'Foto ist Pflicht.':'Ein Foto sagt mehr als drei Sätze.'}</span></div>
      <div class="photos">${(p.fotos||[]).map((f,i)=>`<div class="ph"><img src="${f}" alt="Foto ${i+1}">${ro?'':`<button onclick="delFoto('${p.id}',${i})">×</button>`}</div>`).join('')}</div>
      <div class="form">

function setP(id,f,v){
  const p=DB.punkte.find(x=>x.id===id);p[f]=v;
  if(f==='status'&&v==='Mangel'){if(p.stoppVorschlag==='Ja'&&!p._touched)p.arbeitsstopp='Ja';p._touched=true;if(p.terminAuto||!p.termin){p.termin=fristFuer(p.prio);p.terminAuto=true;}}
  if(f==='prio'&&p.terminAuto){p.termin=fristFuer(v);}
  if(f==='termin'){p.terminAuto=false;}
  if(f==='arbeitsstopp'&&v==='Ja'&&p.terminAuto){p.termin=today();}
  syncMassnahme(p);save();
  const el=document.getElementById('pp_'+id);
  if(el&&['status','prio','arbeitsstopp','stoppBegruendung','termin'].includes(f)){render();const n=document.getElementById('pp_'+id);if(n&&f==='status')n.scrollIntoView({block:'nearest'});}
  else if(el){el.className='pp '+ampel(p);}
}
function shrink(file,cb){const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',.7));};img.src=url;}
function addFoto(id,inp){const f=inp.files[0];if(!f)return;shrink(f,d=>{const p=DB.punkte.find(x=>x.id===id);p.fotos=p.fotos||[];p.fotos.push(d);save();render();});}
function delFoto(id,i){const p=DB.punkte.find(x=>x.id===id);p.fotos.splice(i,1);save();render();}

S.abschluss=()=>{

  </div>
  ${(themen.length||vb2.length)?`<div class="card mt" style="border-left:4px solid var(--accent)"><h3>Vorschlag für das Sicherheitsgespräch</h3>
  <p class="small muted">Diese Punkte lohnen sich zum Ansprechen – erst das Gute, dann das Fehlende.</p>

  <button class="btn sm mt" onclick="document.getElementById('a_fazit').value=(document.getElementById('a_fazit').value?document.getElementById('a_fazit').value+'\n':'')+document.getElementById('a_themen').textContent;toast('Ins Kurzfazit übernommen.')">Ins Kurzfazit übernehmen</button></div>`:''}
  <div class="row mt"><button class="btn p" onclick="abschliessen('${k.id}')">Kontrolle abschliessen und Bericht erzeugen</button><button class="btn ghost" onclick="go('pruefen',{id:'${k.id}'})">Zurück</button></div>
  <p class="small muted mt">Nach dem Abschluss sind die Prüfpunkte gesperrt. Massnahmen bleiben unter «Massnahmen» bearbeitbar.</p></div>`;
};
let sigDirty=false;
function initSig(){const c=document.getElementById('sig');if(!c)return;const ctx=c.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#1D2229';let d=false;const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};
  c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e));};c.onpointermove=e=>{if(!d)return;ctx.lineTo(...pos(e));ctx.stroke();sigDirty=true;};c.onpointerup=c.onpointercancel=()=>d=false;sigDirty=false;}
function clearSig(){const c=document.getElementById('sig');c.getContext('2d').clearRect(0,0,c.width,c.height);sigDirty=false;}
function abschliessen(id){const k=DB.kontrollen.find(x=>x.id===id);if(!sigDirty){toast('Bitte unterschreiben.');return;}
  k.fazit=document.getElementById('a_fazit').value;k.gespraech=document.getElementById('a_g').value;k.teilnehmer=document.getElementById('a_tn').value;k.sig=document.getElementById('sig').toDataURL('image/png');k.abgeschlossen=true;k.abgeschlossenAm=new Date().toISOString();k.gesamt=gesamt(k);save();go('bericht',{id});}
S.kontrollen=()=>{const ks=[...DB.kontrollen].sort((a,b)=>b.datum.localeCompare(a.datum));const f=route.f||'';const fl=f?ks.filter(k=>k.art===f):ks;
  return `<div class="head"><div><h1>Kontrollen</h1><p>${ks.length} Kontrollen · ${ks.filter(k=>!k.abgeschlossen).length} offen</p></div><button class="btn p" onclick="go('neu')">＋ Neue Kontrolle</button></div>
  <div class="filters"><select onchange="route.f=this.value;render()"><option value="">Alle Kontrollarten</option>${Object.entries(ARTEN).map(([k,v])=>`<option value="${k}" ${f===k?'selected':''}>${v}</option>`).join('')}</select></div>

function saveEreignis(){

  const fin=()=>{DB.kontrollen.push(k);k.gesamt=gesamt(k);const e=k.ereignis;
    const p={id:uid(),kontrolle:k.id,vorlage:'EREIGNIS',objektgruppe:'Ereignis: '+e.schwere,objekt:e.schwere,soll:'Kein Ereignis',frage:e.hergang,regel:e.regel,recht:'VUV Art. 6; UVG Art. 45 (Unfallmeldung)',prioStd:e.prio,stoppVorschlag:'Nein',stopArt:'O',status:'Mangel',prio:e.prio,arbeitsstopp:e.schwere.startsWith('Unfall')?'Ja':'Nein',mangel:e.hergang+(e.ursachen.length?' · Ursachen: '+e.ursachen.join(', '):''),sofort:e.sofort,massnahme:e.massnahme||'Ursachenanalyse und Instruktion',betroffene:e.personen,zustaendig:e.zust||k.pruefer,termin:fristFuer(e.prio),terminAuto:true,nk:'Ja',fotos:e.fotos,freigabe:k.pruefer,stoppBegruendung:'',bem:'',wiederaufnahmeAm:'',wiederaufnahmeDurch:''};
    DB.punkte.push(p);syncMassnahme(p);save();toast('Ereignis erfasst – Massnahme angelegt.');go('bericht',{id:k.id});};

  const mg=ps.filter(p=>p.status==='Mangel');const stops=mg.filter(p=>p.arbeitsstopp==='Ja');const vb=ps.filter(p=>p.status==='Vorbildlich');const gs=gruppen(k,ps);const e=k.ereignis;
  const stoppDauer=p=>{const mm=DB.massnahmen.find(x=>x.punkt===p.id);if(!mm||!mm.stoppSeit)return '';const ende=mm.wiederaufnahmeAm?new Date(mm.wiederaufnahmeAm):new Date();const h=Math.max(0,Math.round((ende-new Date(mm.stoppSeit))/36e5));return mm.wiederaufnahmeAm?`Stopp ${h} h · Wiederaufnahme ${fmtDT(mm.wiederaufnahmeAm)} durch ${esc(mm.wiederaufnahmeDurch)}`:`<b style="color:#C4302B">Stopp läuft seit ${h} h</b>`;};

    ${!e&&(k.art==='Tagescheck'||k.art==='Rundgang')?`<h2>Bereichsbewertung${k.umfang==='voll'?' – Regeln, Maschinen und Anschlagmittel':' entlang der 10 lebenswichtigen Regeln'}</h2><table><thead><tr><th style="width:28px"></th><th>Bereich</th><th>Geprüft</th><th>Mängel</th><th>Bewertung</th><th>Beurteilung / besprochen mit</th></tr></thead><tbody>${gs.map(g=>{const br=k.bereich[g.key]||{};return `<tr><td><span class="a ${ampelGruppe(g.punkte)}"></span></td><td>${esc(g.titel)}</td><td>${g.punkte.filter(p=>p.status!=='Nicht geprüft').length}/${g.punkte.length}</td><td>${g.punkte.filter(p=>p.status==='Mangel').length}</td><td>${esc(br.note||'–')}</td><td>${esc(br.text||'')}${br.mit?` <small>(mit ${esc(br.mit)})</small>`:''}</td></tr>`;}).join('')}</tbody></table>`:''}
    ${e?'':`<h2>Mängel und Massnahmen</h2>
    ${mg.length?`<table><thead><tr><th>Ampel</th><th>Objekt / Regel</th><th>Mangel</th><th>Massnahme / Sofortmassnahme</th><th>Prio</th><th>Stopp</th><th>Zuständig</th><th>Termin</th><th>WK</th></tr></thead><tbody>${mg.map(p=>`<tr><td><span class="a ${ampel(p)}"></span>${ampel(p)}</td><td><b>${esc(p.objekt)}</b><br><small>${esc(p.objektgruppe)}${p.regel?' · Regel '+p.regel:''}<br>${esc(p.recht||'')}</small></td><td>${esc(p.mangel)}${p.betroffene?`<br><small>Betroffene: ${esc(p.betroffene)}</small>`:''}</td><td>${esc(p.massnahme)}${p.sofort?`<br><b>Sofort:</b> ${esc(p.sofort)}`:''}${p.stoppBegruendung?`<br><small>Kein Stopp, weil: ${esc(p.stoppBegruendung)}</small>`:''}<br><small>STOP: ${esc(p.stopArt)}</small></td><td>${esc(p.prio)}</td><td>${esc(p.arbeitsstopp)}${p.freigabe?`<br><small>Freigabe: ${esc(p.freigabe)}</small>`:''}${p.arbeitsstopp==='Ja'?`<br><small>${stoppDauer(p)}</small>`:''}</td><td>${esc(p.zustaendig)}</td><td>${fmtD(p.termin)}</td><td>${esc(p.nk)}</td></tr>${p.fotos&&p.fotos.length?`<tr><td colspan="9">${p.fotos.map(f=>`<img class="p" src="${f}" alt="">`).join('')}</td></tr>`:''}`).join('')}</tbody></table>`:'<p>Keine Mängel festgestellt.</p>'}
    ${vb.length?`<h2>Positivbefunde</h2><ul>${vb.map(p=>`<li><b>${esc(p.objekt)}</b>${p.bem?' – '+esc(p.bem):''}</li>`).join('')}</ul>`:''}
    <h2>Alle Prüfpunkte</h2>
    <table><thead><tr><th style="width:28px"></th><th>Bereich</th><th>Objekt</th><th>Prüffrage</th><th>Grundlage</th><th>Status</th><th>Bemerkung</th></tr></thead><tbody>${gs.flatMap(g=>g.punkte.map(p=>`<tr><td><span class="a ${ampel(p)}"></span></td><td>${esc(g.titel.replace(/ – .*/,''))}</td><td>${esc(p.objekt)}</td><td>${esc(p.frage)}</td><td><small>${esc(p.recht||'')}</small></td><td>${esc(p.status)}</td><td>${esc(p.bem)}</td></tr>`)).join('')}</tbody></table>`}

    <div class="foot">Grundlagen: Suva – 10 lebenswichtige Regeln Verkehrsweg- und Tiefbau · Suva-Checklisten (Gräben/Baugruben, Baumaschinen, Elektrizität, Krane, Anschlagmittel, Gerüste, Schächte) · BauAV (SR 832.311.141) · VUV · EKAS 6508. Ampel: OK/vorbildlich = Grün · Mangel Niedrig/Mittel = Gelb · Hoch = Orange · Kritisch oder Arbeitsstopp = Rot. STOPP bei Gefahr – Gefahr beheben – weiterarbeiten. WK = Wirksamkeitskontrolle. Fristen: Kritisch sofort · Hoch 3 Arbeitstage · Mittel 14 Tage · Niedrig 30 Tage.</div>
  </div>`;
};

/* ---------- Massnahmen ---------- */
S.massnahmen=()=>{
  const f=route.f||'offen';const flt=route.flt||{};let ms=DB.massnahmen.slice();
  if(f==='offen')ms=ms.filter(m=>m.status!=='Erledigt'||m.nkStatus==='Offen');if(f==='krit')ms=ms.filter(m=>m.status!=='Erledigt'&&(m.prio==='Kritisch'||m.arbeitsstopp==='Ja'));if(f==='ueb')ms=ms.filter(ueberfaellig);if(f==='nk')ms=ms.filter(m=>m.nkStatus==='Offen');if(f==='stopp')ms=ms.filter(m=>m.arbeitsstopp==='Ja'&&!m.wiederaufnahmeAm);
  if(flt.bs)ms=ms.filter(m=>m.baustelle===flt.bs);if(flt.art)ms=ms.filter(m=>m.kontrollart===flt.art);if(flt.zu)ms=ms.filter(m=>m.zustaendig===flt.zu);
  ms.sort((a,b)=>(a.termin||'9').localeCompare(b.termin||'9'));
  const seg=[['offen','Offen'],['krit','Kritisch'],['stopp','Stopp aktiv'],['ueb','Überfällig'],['nk','Wirksamkeit'],['alle','Alle']];
  return `<div class="head"><div><h1>Massnahmen</h1><p>Zentrale Liste über alle Kontrollarten und Ereignisse · Abschluss erst nach Wirksamkeitskontrolle</p></div><div class="row"><button class="btn noprint" onclick="pdfMassnahmen(route.f||'offen')">PDF Liste</button>${flt.zu?`<button class="btn p noprint" onclick="pdfAuftrag('${esc(flt.zu).replace(/'/g,"&#39;")}')">Auftrag für ${esc(flt.zu)} (PDF)</button><button class="btn noprint" onclick="auftragMail('${esc(flt.zu).replace(/'/g,"&#39;")}')">per Mail</button>`:''}</div></div>
  <div class="seg mb">${seg.map(([k,l])=>`<button class="${f===k?'on':''}" onclick="route.f='${k}';render()">${l}</button>`).join('')}</div>
  <div class="filters"><select onchange="route.flt={...route.flt,zu:this.value};render()"><option value="">Alle Zuständigen</option>${[...new Set(DB.massnahmen.filter(m=>m.status!=='Erledigt').map(m=>m.zustaendig).filter(Boolean))].sort().map(z=>`<option value="${esc(z)}" ${flt.zu===z?'selected':''}>${esc(z)}</option>`).join('')}</select><select onchange="route.flt={...route.flt,bs:this.value};render()"><option value="">Alle Baustellen</option>${DB.baustellen.map(b=>`<option value="${b.id}" ${flt.bs===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select><select onchange="route.flt={...route.flt,art:this.value};render()"><option value="">Alle Kontrollarten</option>${Object.entries(ARTEN).map(([k,v])=>`<option value="${k}" ${flt.art===k?'selected':''}>${v}</option>`).join('')}</select></div>
  ${ms.length?ms.map(mCard).join(''):'<div class="empty">Keine Massnahmen in dieser Auswahl.</div>'}${DL()}`;
};
function mCard(m){
  const a=m.status==='Erledigt'?'Grün':m.arbeitsstopp==='Ja'||m.prio==='Kritisch'?'Rot':m.prio==='Hoch'?'Orange':'Gelb';
  const k=DB.kontrollen.find(x=>x.id===(DB.punkte.find(p=>p.id===m.punkt)||{}).kontrolle);const stoppAktiv=m.arbeitsstopp==='Ja'&&!m.wiederaufnahmeAm;
  return `<div class="pp ${a}"><div class="row sp"><div><div class="eyebrow">${esc(bs(m.baustelle).name)} · ${esc(ARTEN[m.kontrollart])} · ${k?esc(k.nr):''}${m.regel?' · Regel '+m.regel:''}</div><div class="q"><b>${esc(m.objekt)}</b> – ${esc(m.mangel)}</div><div class="soll">Massnahme: ${esc(m.massnahme)}${m.sofort?' · Sofort: '+esc(m.sofort):''}${m.recht?' · '+esc(m.recht):''}</div>
  <div class="meta"><span class="pill ${m.prio==='Kritisch'?'r':m.prio==='Hoch'?'o':'y'}">${esc(m.prio)}</span>${m.arbeitsstopp==='Ja'?`<span class="pill ${stoppAktiv?'r':'n'}">${stoppAktiv?'Arbeitsstopp aktiv seit '+fmtDT(m.stoppSeit):'Stopp aufgehoben '+fmtDT(m.wiederaufnahmeAm)}</span>`:''}<span class="pill n">${esc(m.zustaendig||'– ohne Zuständigen')}</span><span class="pill ${ueberfaellig(m)?'r':'n'}">Termin ${fmtD(m.termin)}${ueberfaellig(m)?' · überfällig':''}</span>${m.nk==='Ja'?`<span class="pill ${m.nkStatus==='Offen'?'o':m.nkStatus==='Erledigt'?'g':'b'}">Wirksamkeit ${esc(m.nkStatus||'nötig')}${m.wirksam?' · '+esc(m.wirksam):''}</span>`:''}</div></div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end"><select style="border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);min-height:44px" onchange="setM('${m.id}','status',this.value)">${['Offen','In Arbeit','Blockiert','Erledigt'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select>
  ${stoppAktiv?`<button class="btn sm danger" onclick="wiederaufnahme('${m.id}')">Arbeit freigeben / Wiederaufnahme</button>`:''}
  ${m.nkStatus==='Offen'?`<button class="btn sm p" onclick="nkErledigt('${m.id}',true)">Wirksamkeitskontrolle: wirksam</button><button class="btn sm danger" onclick="nkErledigt('${m.id}',false)">Nicht wirksam – neu öffnen</button>`:''}
  ${m.status==='Erledigt'&&!m.fotosNach.length?`<label class="btn sm">📷 Foto nachher<input type="file" accept="image/*" capture="environment" hidden onchange="addFotoM('${m.id}',this)"></label>`:''}</div></div>
  ${m.fotosNach.length?`<div class="photos">${m.fotosNach.map(f=>`<div class="ph"><img src="${f}" alt="nachher"></div>`).join('')}</div>`:''}
  ${m.erledigt?`<div class="small muted mt">Erledigt am ${fmtD(m.erledigt)}${m.nkDatum?' · Wirksamkeitskontrolle '+fmtD(m.nkDatum)+' durch '+esc(m.nkDurch||''):''}</div>`:''}</div>`;
}
function setM(id,f,v){const m=DB.massnahmen.find(x=>x.id===id);
  if(f==='status'&&v==='Erledigt'&&m.arbeitsstopp==='Ja'&&!m.wiederaufnahmeAm){toast('Zuerst Wiederaufnahme der Arbeit dokumentieren.');render();return;}
  m[f]=v;if(f==='status'){if(v==='Erledigt'){m.erledigt=today();if(m.nk==='Ja'&&m.nkStatus!=='Erledigt')m.nkStatus='Offen';}else{m.erledigt='';}}save();render();}
async function wiederaufnahme(id){const m=DB.massnahmen.find(x=>x.id===id);const wer=await eingabe('Freigabe zur Wiederaufnahme der Arbeit',localStorage.getItem('suva_user')||'','Name, Funktion');if(!wer)return;m.wiederaufnahmeAm=new Date().toISOString();m.wiederaufnahmeDurch=wer;const p=DB.punkte.find(x=>x.id===m.punkt);if(p){p.wiederaufnahmeAm=m.wiederaufnahmeAm;p.wiederaufnahmeDurch=wer;}save();render();toast('Wiederaufnahme dokumentiert.');}
async function nkErledigt(id,ok){const m=DB.massnahmen.find(x=>x.id===id);const wer=await eingabe(ok?'Wirksamkeitskontrolle – wirksam, durchgeführt durch':'Wirksamkeitskontrolle – nicht wirksam, beurteilt durch',localStorage.getItem('suva_user')||'','Name');if(wer===null)return;
  if(ok){m.nkStatus='Erledigt';m.nkDatum=today();m.nkDurch=wer;m.wirksam='wirksam';toast('Wirksamkeit bestätigt.');}
  else{m.nkStatus='';m.wirksam='nicht wirksam';m.status='Offen';m.erledigt='';m.prio=m.prio==='Niedrig'?'Mittel':m.prio==='Mittel'?'Hoch':'Kritisch';m.termin=fristFuer(m.prio);m.nkDurch=wer;toast('Massnahme neu geöffnet mit höherer Priorität.');}
  save();render();}
function addFotoM(id,inp){const f=inp.files[0];if(!f)return;shrink(f,d=>{DB.massnahmen.find(x=>x.id===id).fotosNach.push(d);save();render();});}
S.massnahmenPdf=()=>{const f=route.f;let ms=DB.massnahmen.filter(m=>f==='alle'||(f==='nk'?m.nkStatus==='Offen':f==='ueb'?ueberfaellig(m):f==='stopp'?(m.arbeitsstopp==='Ja'&&!m.wiederaufnahmeAm):f==='krit'?(m.status!=='Erledigt'&&(m.prio==='Kritisch'||m.arbeitsstopp==='Ja')):m.status!=='Erledigt'));
  return `<div class="row sp mb noprint"><button class="btn ghost" onclick="go('massnahmen',{f})">‹ Zurück</button><button class="btn p" onclick="pdfMassnahmen('${f}')">PDF exportieren</button></div>
  <div class="report"><div class="hdr"><div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#555">Sicherheitsaudit Grossbaustelle Tiefbau</div><h1>Massnahmenliste – ${esc({offen:'offen',krit:'kritisch',stopp:'Arbeitsstopp aktiv',ueb:'überfällig',nk:'Wirksamkeitskontrolle offen',alle:'alle'}[f])}</h1><div>Stand ${fmtD(today())} · ${ms.length} Einträge</div></div></div>
  <table><thead><tr><th>Baustelle</th><th>Quelle</th><th>Regel</th><th>Objekt</th><th>Mangel</th><th>Massnahme</th><th>Grundlage</th><th>Prio</th><th>Stopp</th><th>Zuständig</th><th>Termin</th><th>Status</th><th>WK</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${esc(bs(m.baustelle).name)}</td><td>${esc(ARTK[m.kontrollart])}</td><td>${m.regel||'–'}</td><td>${esc(m.objekt)}</td><td>${esc(m.mangel)}</td><td>${esc(m.massnahme)}</td><td><small>${esc(m.recht||'')}</small></td><td>${esc(m.prio)}</td><td>${esc(m.arbeitsstopp)}</td><td>${esc(m.zustaendig)}</td><td>${fmtD(m.termin)}${ueberfaellig(m)?' !':''}</td><td>${esc(m.status)}</td><td>${esc(m.nkStatus||m.nk)}</td></tr>`).join('')}</tbody></table></div>`;};

/* ---------- Dashboard ---------- */
function dashBody(){
  const ps=DB.punkte.filter(p=>p.status&&p.status!=='Nicht geprüft');const ms=DB.massnahmen;const erl=ms.filter(m=>m.status==='Erledigt').length;
  const byArt=k=>({n:DB.kontrollen.filter(x=>x.art===k).length,p:ps.filter(p=>(DB.kontrollen.find(x=>x.id===p.kontrolle)||{}).art===k).length,m:ms.filter(m=>m.kontrollart===k).length,o:ms.filter(m=>m.kontrollart===k&&m.status!=='Erledigt').length,kr:ms.filter(m=>m.kontrollart===k&&m.status!=='Erledigt'&&m.prio==='Kritisch').length});
  const bars=(title,keyf,items)=>{const rows=items.map(i=>{const sub=ms.filter(m=>keyf(m)===i);return [i,sub.filter(m=>m.status!=='Erledigt'&&(m.prio==='Kritisch'||m.arbeitsstopp==='Ja')).length,sub.filter(m=>m.status!=='Erledigt'&&!(m.prio==='Kritisch'||m.arbeitsstopp==='Ja')).length,sub.filter(m=>m.status==='Erledigt').length];}).filter(r=>r[1]+r[2]+r[3]>0).sort((a,b)=>(b[1]+b[2]+b[3])-(a[1]+a[2]+a[3]));const mx=Math.max(1,...rows.map(r=>r[1]+r[2]+r[3]));
    return `<div class="card"><h3>${title}</h3>${rows.length?rows.map(r=>`<div class="bar"><span class="lb" title="${esc(r[0])}">${esc(r[0])}</span><span class="tr"><i style="width:${r[1]/mx*100}%;background:var(--crit)"></i><i style="width:${r[2]/mx*100}%;background:var(--warn)"></i><i style="width:${r[3]/mx*100}%;background:var(--ok)"></i></span><b>${r[1]+r[2]+r[3]}</b></div>`).join('')+'<div class="small muted mt"><span class="dot Rot"></span> kritisch/Stopp offen &nbsp; <span class="dot Gelb"></span> übrige offen &nbsp; <span class="dot Grün"></span> erledigt</div>':'<p class="muted small">Noch keine Daten.</p>'}</div>`;};
  const erlDauer=ms.filter(m=>m.erledigt&&m.erstellt).map(m=>daysBetween(m.erstellt.slice(0,10),m.erledigt));const medDauer=erlDauer.length?erlDauer.sort((a,b)=>a-b)[Math.floor(erlDauer.length/2)]:'–';
  const wieder=Object.entries(ms.reduce((a,m)=>{const k=bs(m.baustelle).name+' · '+m.objekt;a[k]=(a[k]||0)+1;return a;},{})).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const faellig=kontrollenFaellig();
  return `<p class="small muted mb">Auswertung über Tagescheck, Rundgang, Audit, Geräte/Maschinen, Meldungen und Ereignisse.</p>
  <div class="grid g3 mb"><div class="kpi acc"><b>${DB.kontrollen.length}</b><span>Kontrollen</span></div><div class="kpi"><b>${ps.length}</b><span>Geprüfte Punkte</span></div><div class="kpi crit"><b>${ms.filter(m=>m.status!=='Erledigt'&&m.prio==='Kritisch').length}</b><span>Kritisch offen</span></div><div class="kpi crit"><b>${ms.filter(m=>m.arbeitsstopp==='Ja'&&!m.wiederaufnahmeAm).length}</b><span>Arbeitsstopps aktiv</span></div><div class="kpi warn"><b>${ms.filter(ueberfaellig).length}</b><span>Überfällig</span></div><div class="kpi ok"><b>${ms.length?Math.round(erl/ms.length*100):0}%</b><span>Erledigungsquote</span></div><div class="kpi acc"><b>${medDauer}</b><span>Median Tage bis erledigt</span></div><div class="kpi ${faellig.length?'warn':'ok'}"><b>${faellig.length}</b><span>Kontrollen überfällig</span></div><div class="kpi acc"><b>${DB.kontrollen.filter(k=>k.art==='Ereignis').length}</b><span>Ereignisse / Beinaheunfälle</span></div><div class="kpi ok"><b>${DB.punkte.filter(p=>p.status==='Vorbildlich').length}</b><span>Positivbefunde</span></div></div>
  <div class="card mb tw"><table class="tb"><thead><tr><th>Kontrollart</th><th>Kontrollen</th><th>Geprüfte Punkte</th><th>Mängel</th><th>Offen</th><th>Kritisch offen</th></tr></thead><tbody>${Object.entries(ARTEN).map(([k,v])=>{const r=byArt(k);return `<tr><td><b>${v}</b></td><td>${r.n}</td><td>${r.p}</td><td>${r.m}</td><td>${r.o}</td><td class="${r.kr?'crit-c':''}">${r.kr}</td></tr>`;}).join('')}</tbody></table></div>
  <div class="grid g2">${bars('Mängel nach lebenswichtiger Regel',m=>m.regel?`Regel ${m.regel} – ${REG[String(m.regel)]}`:'Organisation / Gesundheit',Object.keys(REG).map(n=>+n?`Regel ${n} – ${REG[n]}`:'Organisation / Gesundheit'))}${bars('Mängel nach Baustelle',m=>bs(m.baustelle).name,DB.baustellen.map(b=>b.name))}${bars('Mängel nach Gefahrenstelle / Thema',m=>m.kategorie,[...new Set(ms.map(m=>m.kategorie))])}${bars('Mängel nach Zuständigem',m=>m.zustaendig||'– offen',[...new Set(ms.map(m=>m.zustaendig||'– offen'))])}
  <div class="card"><h3>Wiederholte Mängel (gleiches Objekt, gleiche Baustelle)</h3>${wieder.length?wieder.map(([k,n])=>`<div class="bar"><span class="lb" style="flex-basis:70%">${esc(k)}</span><b>${n}×</b></div>`).join(''):'<p class="muted small">Keine Wiederholungen.</p>'}</div>
  <div class="card"><h3>Kontrollrhythmus je Baustelle</h3>${DB.baustellen.filter(b=>b.status==='Aktiv').map(b=>`<div class="small mb"><b>${esc(b.name)}</b><br>${Object.entries(RHYTHMUS).map(([a,t])=>{const l=letzteKontrolle(b.id,a);const d=l?daysBetween(l,today()):null;return `<span class="pill ${d===null||d>=t?'r':'g'}" style="margin:2px 4px 2px 0">${ARTK[a]}: ${l?'vor '+d+' T.':'nie'}</span>`;}).join('')}</div>`).join('')||'<p class="muted small">Keine aktiven Baustellen.</p>'}</div></div>`;
};

/* ---------- Stammdaten ---------- */
S.maschinen=()=>`<div class="head"><div><h1>Maschinen / Geräte</h1><p>Maschinenregister – Prüfungen liegen unter Kontrollen</p></div><button class="btn p" onclick="editM('')">＋ Neu</button></div>
  <div class="list">${DB.maschinen.map(m=>{const pr=DB.kontrollen.filter(k=>k.maschine===m.id).sort((a,b)=>b.datum.localeCompare(a.datum));const mg=DB.massnahmen.filter(x=>x.status!=='Erledigt'&&pr.some(k=>(DB.punkte.find(p=>p.id===x.punkt)||{}).kontrolle===k.id)).length;
  return `<button class="item" onclick="editM('${m.id}')"><span class="pill ${m.zustand==='Gesperrt'?'r':m.zustand==='Eingeschränkt'?'o':'g'}">${esc(m.zustand)}</span><span><div class="ti">${esc(m.name)} · ${esc(m.inv)}</div><div class="su">${esc(m.typ)} · ${esc(bs(m.baustelle).name)} · ${pr.length} Prüfungen${pr[0]?' · letzte '+fmtD(pr[0].datum):''}${mg?` · <b class="crit-c">${mg} offene Mängel</b>`:''}${m.naechste&&m.naechste<today()?' · <b class="crit-c">Wartung überfällig</b>':''}</div></span><span class="ch">›</span></button>`;}).join('')}</div>
  ${route.edit!==undefined?formM(route.edit):''}`;
function editM(id){route.edit=id;render();setTimeout(()=>{const e=document.getElementById('fm');if(e)e.scrollIntoView({behavior:'smooth'});},50);}
function formM(id){const m=DB.maschinen.find(x=>x.id===id)||{name:'',inv:'',typ:MTYPEN[0],hersteller:'',baustelle:(DB.baustellen[0]||{}).id,betreiber:'',wartung:'',naechste:'',zustand:'Einsatzbereit',bem:''};
  const f=(k,l,t='text')=>`<label class="f"><span>${l}</span><input id="m_${k}" type="${t}" value="${esc(m[k])}"></label>`;
  return `<div class="card mt" id="fm"><h3>${id?'Maschine bearbeiten':'Neue Maschine'}</h3><div class="form mt">${f('name','Gerät/Maschine')}${f('inv','Inventar-Nr.')}<label class="f"><span>Typ (steuert die Prüfpunkte)</span><select id="m_typ">${MTYPEN.map(t=>`<option ${m.typ===t?'selected':''}>${t}</option>`).join('')}</select></label>${f('hersteller','Hersteller')}<label class="f"><span>Standort/Baustelle</span><select id="m_baustelle">${DB.baustellen.map(b=>`<option value="${b.id}" ${m.baustelle===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label>${f('betreiber','Verantwortlicher Betreiber')}${f('wartung','Letzte Wartung','date')}${f('naechste','Nächste Wartung','date')}<label class="f"><span>Betriebszustand</span><select id="m_zustand">${['Einsatzbereit','Eingeschränkt','Gesperrt'].map(z=>`<option ${m.zustand===z?'selected':''}>${z}</option>`).join('')}</select></label>${f('bem','Bemerkung')}</div>
  <div class="row mt"><button class="btn p" onclick="saveM('${id}')">Speichern</button><button class="btn ghost" onclick="delete route.edit;render()">Abbrechen</button>${id?`<button class="btn ghost crit-c" onclick="delMaschine('${id}')">Löschen</button>`:''}</div></div>`;}
function saveM(id){const o={};['name','inv','typ','hersteller','baustelle','betreiber','wartung','naechste','zustand','bem'].forEach(k=>o[k]=document.getElementById('m_'+k).value);if(!o.name){toast('Name fehlt');return;}if(id)Object.assign(DB.maschinen.find(x=>x.id===id),o);else DB.maschinen.push({id:uid(),...o});save();delete route.edit;render();}

S.baustellen=()=>`<div class="head"><div><h1>Baustellen</h1><p>Mit SiGe-Konzept (Art. 4 BauAV), Subunternehmern und Suva-Meldungen</p></div><button class="btn p" onclick="editB('')">＋ Neu</button></div>
  <div class="list">${DB.baustellen.map(b=>{const n=DB.kontrollen.filter(k=>k.baustelle===b.id).length;const o=DB.massnahmen.filter(m=>m.baustelle===b.id&&m.status!=='Erledigt').length;const sige=(b.sige||{}).datum;return `<button class="item" onclick="editB('${b.id}')"><span class="pill ${b.status==='Aktiv'?'g':'n'}">${esc(b.status)}</span><span><div class="ti">${esc(b.name)} · ${esc(b.nr)}</div><div class="su">${esc(b.ort)} · Bauleiter ${esc(b.bauleiter||'–')} · Polier ${esc(b.polier||'–')} · ${n} Kontrollen · ${o} offene Massnahmen · ${sige?'SiGe-Konzept '+fmtD(sige):'<b class="crit-c">SiGe-Konzept fehlt</b>'} · ${DB.subs.filter(s=>s.baustelle===b.id).length} Subunternehmer</div></span><span class="ch">›</span></button>`;}).join('')}</div>
  ${route.edit!==undefined?formB(route.edit):''}`;
function editB(id){route.edit=id;render();setTimeout(()=>{const e=document.getElementById('fb');if(e)e.scrollIntoView({behavior:'smooth'});},50);}
function formB(id){const b=DB.baustellen.find(x=>x.id===id)||{name:'',nr:'',ort:'',bauleiter:'',polier:'',status:'Aktiv',start:'',ende:'',bem:'',sige:{},charta:'Ja',meldung:'',meldungArt:''};const s=b.sige||{};const f=(k,l,t='text')=>`<label class="f"><span>${l}</span><input id="b_${k}" type="${t}" value="${esc(b[k]||'')}"></label>`;
  const subs=DB.subs.filter(x=>x.baustelle===id);
  return `<div class="card mt" id="fb"><h3>${id?'Baustelle bearbeiten':'Neue Baustelle'}</h3><div class="form mt">${f('name','Baustelle')}${f('nr','Projekt-Nr.')}${f('ort','Ort')}<label class="f"><span>Sparte / Bereich</span><select id="b_sparte">${SPARTEN.map(s=>`<option ${(b.sparte||'Tiefbau')===s?'selected':''}>${s}</option>`).join('')}</select></label>${f('bauleiter','Bauleiter')}${f('polier','Polier')}<label class="f"><span>Status</span><select id="b_status"><option ${b.status==='Aktiv'?'selected':''}>Aktiv</option><option ${b.status==='Abgeschlossen'?'selected':''}>Abgeschlossen</option></select></label>${f('start','Startdatum','date')}${f('ende','Enddatum','date')}${f('bem','Bemerkung')}</div>
  <h3 class="mt">Sicherheits- und Gesundheitsschutzkonzept (Art. 4 BauAV)</h3><div class="form mt"><label class="f"><span>Version / Stand vom</span><input id="s_datum" type="date" value="${esc(s.datum||'')}"></label><label class="f"><span>Erstellt durch</span><input id="s_von" value="${esc(s.von||'')}"></label><label class="f"><span>Mitarbeitende instruiert am</span><input id="s_instr" type="date" value="${esc(s.instruiert||'')}"></label><label class="f"><span>Ablage / Link (SharePoint, Ordner)</span><input id="s_link" value="${esc(s.link||'')}"></label><label class="f"><span>Titelblatt als Foto</span><input type="file" id="s_foto" accept="image/*"></label>${s.foto?`<div class="photos"><div class="ph"><img src="${s.foto}" alt="SiGe"></div></div>`:''}
  <label class="f"><span>Sicherheits-Charta unterzeichnet</span><select id="b_charta"><option ${b.charta==='Ja'?'selected':''}>Ja</option><option ${b.charta==='Nein'?'selected':''}>Nein</option></select></label><label class="f"><span>Meldepflichtige Arbeiten (Suva, 14 Tage vorher)</span><select id="b_meldungArt"><option value="">keine</option>${['Asbestsanierung','Untertagarbeiten','Gesteinsabbau','Andere'].map(x=>`<option ${b.meldungArt===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="f"><span>Meldung erfolgt am</span><input id="b_meldung" type="date" value="${esc(b.meldung||'')}"></label></div>
  ${id?`<h3 class="mt">Subunternehmer auf dieser Baustelle</h3><div class="tw"><table class="tb"><thead><tr><th>Firma</th><th>Ansprechperson</th><th>Gewerk</th><th>Instruiert am</th><th>durch</th><th></th></tr></thead><tbody>${subs.map(x=>`<tr><td>${esc(x.firma)}</td><td>${esc(x.kontakt)}</td><td>${esc(x.gewerk)}</td><td class="${x.instr?'':'crit-c'}">${x.instr?fmtD(x.instr):'nicht instruiert'}</td><td>${esc(x.durch)}</td><td><button class="btn sm ghost" onclick="DB.subs=DB.subs.filter(y=>y.id!=='${x.id}');save();render()">×</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Noch keine Subunternehmer erfasst.</td></tr>'}</tbody></table></div>
  <div class="form mt"><label class="f"><span>Firma</span><input id="sub_firma"></label><label class="f"><span>Ansprechperson / Tel.</span><input id="sub_kontakt"></label><label class="f"><span>Gewerk</span><input id="sub_gewerk"></label><label class="f"><span>Instruiert am</span><input id="sub_instr" type="date"></label><label class="f"><span>Instruiert durch</span><input id="sub_durch"></label></div><button class="btn sm mt" onclick="addSub('${id}')">Subunternehmer hinzufügen</button>`:''}
  <div class="row mt"><button class="btn p" onclick="saveB('${id}')">Speichern</button><button class="btn ghost" onclick="delete route.edit;render()">Abbrechen</button>${id?`<button class="btn ghost crit-c" onclick="delBaustelle('${id}')">Baustelle löschen</button>`:''}</div></div>`;}
function addSub(bid){const g=i=>document.getElementById(i).value;if(!g('sub_firma')){toast('Firma fehlt');return;}DB.subs.push({id:uid(),baustelle:bid,firma:g('sub_firma'),kontakt:g('sub_kontakt'),gewerk:g('sub_gewerk'),instr:g('sub_instr'),durch:g('sub_durch')});save();render();}
function saveB(id){const o={};['name','nr','ort','sparte','bauleiter','polier','status','start','ende','bem','charta','meldung','meldungArt'].forEach(k=>o[k]=document.getElementById('b_'+k).value);if(!o.name){toast('Name fehlt');return;}
  const b=id?DB.baustellen.find(x=>x.id===id):{id:uid(),sige:{}};Object.assign(b,o);b.sige=b.sige||{};b.sige.datum=document.getElementById('s_datum').value;b.sige.von=document.getElementById('s_von').value;b.sige.instruiert=document.getElementById('s_instr').value;b.sige.link=document.getElementById('s_link').value;
  if(!id)DB.baustellen.push(b);const f=document.getElementById('s_foto').files[0];const fin=()=>{save();delete route.edit;render();};if(f)shrink(f,d=>{b.sige.foto=d;fin();});else fin();}

S.personen=()=>{const alt=p=>!p.instr10||daysBetween(p.instr10,today())>365;const fb=route.fb||'';const liste=DB.personen.filter(p=>!fb||p.baustelle===fb||(fb==='-'&&!p.baustelle));
  return `<div class="head"><div><h1>Personen / Instruktionen</h1><p>Instruktionsnachweise (10 lebenswichtige Regeln) und Ausweise für gefährliche Arbeiten – Nachweis gegenüber Suva</p></div><button class="btn p" onclick="editP('')">＋ Neu</button></div>
  <div class="grid g3 mb"><div class="kpi acc"><b>${DB.personen.length}</b><span>Personen</span></div><div class="kpi ${DB.personen.filter(alt).length?'crit':'ok'}"><b>${DB.personen.filter(alt).length}</b><span>Instruktion fehlt / älter als 1 Jahr</span></div><div class="kpi acc"><b>${DB.personen.filter(p=>(p.ausweise||[]).length).length}</b><span>mit Ausweisen</span></div></div>
  <div class="filters"><select onchange="route.fb=this.value;render()"><option value="">Alle Baustellen</option><option value="-" ${fb==='-'?'selected':''}>– nicht zugeteilt –</option>${DB.baustellen.map(b=>`<option value="${b.id}" ${fb===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
  <div class="list">${liste.map(p=>`<button class="item" onclick="editP('${p.id}')"><span class="pill ${alt(p)?'r':'g'}">${p.instr10?'10 Regeln '+fmtD(p.instr10):'nicht instruiert'}</span><span><div class="ti">${esc(p.name)} · ${esc(p.funktion)}</div><div class="su">${esc(p.firma||'eigen')} · ${p.baustelle?esc(bs(p.baustelle).name):'keiner Baustelle zugeteilt'} · ${(p.fahr||[]).length?'Kat. '+p.fahr.join('/'):'kein Fahrausweis'} · ${(p.ausweise||[]).join(', ')||'keine Ausweise'}</div></span><span class="ch">›</span></button>`).join('')||'<div class="empty">Noch keine Personen erfasst.</div>'}</div>
  ${route.edit!==undefined?formP(route.edit):''}`;};
function editP(id){route.edit=id;render();setTimeout(()=>{const e=document.getElementById('fp');if(e)e.scrollIntoView({behavior:'smooth'});},50);}
function formP(id){const p=DB.personen.find(x=>x.id===id)||{name:'',funktion:'Mitarbeiter/in',firma:'',mail:'',baustelle:'',fahr:[],fahrBis:'',czvBis:'',instr10:'',instr10durch:'',sige:'',ausweise:[],instr:{},ausweisBis:{},bem:''};
  const ins=p.instr||{};const ab=p.ausweisBis||{};
  return `<div class="card mt" id="fp"><h3>${id?'Person bearbeiten':'Neue Person'}</h3><div class="form mt"><label class="f req"><span>Name</span><input id="p_name" value="${esc(p.name)}"></label><label class="f"><span>Funktion</span><select id="p_funktion">${['Mitarbeiter/in','Maschinist/in','Vorarbeiter/in','Polier/in','Bauführer/in','SiBe / KOPAS','Temporär','Subunternehmer','Lernende/r'].map(x=>`<option ${p.funktion===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="f"><span>Firma (leer = eigen)</span><input id="p_firma" value="${esc(p.firma)}"></label><label class="f"><span>E-Mail (für Erinnerungen)</span><input id="p_mail" type="email" value="${esc(p.mail||'')}"></label><label class="f"><span>Baustelle / Standort</span><select id="p_baustelle"><option value="">– nicht zugeteilt / mehrere –</option>${DB.baustellen.map(b=>`<option value="${b.id}" ${p.baustelle===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label><label class="f"><span>Instruiert durch (zuletzt)</span><input id="p_instr10durch" value="${esc(p.instr10durch)}"></label>
  <div class="f full"><span class="small" style="font-weight:600;color:var(--ink2)">Fahrausweis – Kategorien (Führerausweis)</span>
  <div class="row" style="margin-top:6px">${FAHRAUSWEISE.map(([k,v])=>`<label class="chk"><input type="checkbox" class="p_fahr" value="${k}" ${(p.fahr||[]).includes(k)?'checked':''}> <b>${k}</b> – ${esc(v)}</label>`).join('')}</div></div>
  <label class="f"><span>Führerausweis gültig / Kontrolle bis</span><input id="p_fahrBis" type="date" value="${esc(p.fahrBis||'')}"></label>
  <label class="f"><span>CZV / Chauffeurzulassung gültig bis</span><input id="p_czvBis" type="date" value="${esc(p.czvBis||'')}"></label>
  <div class="f full"><span class="small" style="font-weight:600;color:var(--ink2)">Instruktionen – Datum der letzten Durchführung (Wiederholung alle ${esc(cfg('instrIntervall',12))} Monate)</span>
  <div class="grid g2" style="margin-top:6px">${THEMEN.map((t,i)=>{const d=ins[t]||'';const f=d?faelligAm(d,+cfg('instrIntervall',12)):'';const ueb=d&&f<today();const pf=THEMEN_PFLICHT.includes(t);
    return `<label class="f"><span>${esc(t)}${pf?' <b class="crit-c">·Pflicht</b>':''}</span><input class="p_in" data-t="${esc(t)}" type="date" value="${esc(d)}"><span class="small ${ueb?'crit-c':'muted'}">${d?(ueb?'überfällig seit '+fmtD(f):'gültig bis '+fmtD(f)):(pf?'nie instruiert':'')}</span></label>`;}).join('')}</div></div>
  <div class="f full"><span class="small" style="font-weight:600;color:var(--ink2)">Ausweise / Ausbildungen (gefährliche Arbeiten) – mit Gültigkeit, falls befristet</span>
  <div class="grid g2" style="margin-top:6px">${AUSWEISE.map(a=>{const on=(p.ausweise||[]).includes(a);const bis=ab[a]||'';const ueb=bis&&bis<today();
    return `<div class="row" style="align-items:center;gap:8px"><label class="chk" style="flex:1"><input type="checkbox" class="p_aus" value="${esc(a)}" ${on?'checked':''}> ${esc(a)}</label><input class="p_bis" data-a="${esc(a)}" type="date" value="${esc(bis)}" title="gültig bis" style="max-width:170px;border:1px solid ${ueb?'var(--crit)':'var(--line)'};border-radius:8px;padding:8px;background:var(--surface)"></div>`;}).join('')}</div></div>
  <label class="f full"><span>Bemerkung (Ausweis-Nr., Bemerkungen)</span><input id="p_bem" value="${esc(p.bem)}"></label></div>
  <div class="row mt"><button class="btn p" onclick="saveP('${id}')">Speichern</button><button class="btn ghost" onclick="delete route.edit;render()">Abbrechen</button>${id?`<button class="btn ghost crit-c" onclick="delPerson('${id}')">Löschen</button>`:''}</div></div>`;}
function saveP(id){const o={};['name','funktion','firma','mail','baustelle','fahrBis','czvBis','instr10durch','bem'].forEach(k=>o[k]=document.getElementById('p_'+k).value);
  o.fahr=[...document.querySelectorAll('.p_fahr:checked')].map(i=>i.value);
  o.ausweise=[...document.querySelectorAll('.p_aus:checked')].map(i=>i.value);
  o.instr={};document.querySelectorAll('.p_in').forEach(i=>{if(i.value)o.instr[i.dataset.t]=i.value;});
  o.ausweisBis={};document.querySelectorAll('.p_bis').forEach(i=>{if(i.value&&o.ausweise.includes(i.dataset.a))o.ausweisBis[i.dataset.a]=i.value;});
  o.instr10=o.instr[THEMEN[0]]||'';o.sige=o.instr[THEMEN[1]]||'';
  if(!o.name){toast('Name fehlt');return;}if(id)Object.assign(DB.personen.find(x=>x.id===id),o);else DB.personen.push({id:uid(),...o});save();delete route.edit;render();}

S.gespraech=()=>`<div class="head"><div><h1>10 lebenswichtige Regeln & Sicherheitsgespräch</h1><p>Leitfaden für das Gespräch vor Ort; Teilnehmende werden beim Abschluss der Kontrolle erfasst (Mitwirkung).</p></div></div>
  <div class="card"><h3>10 lebenswichtige Regeln Verkehrsweg- und Tiefbau (Suva)</h3>${STAMM.regeln.map(r=>`<div class="phase"><b>${r.Nr}. ${esc(r.Regel)}</b><div><div><span class="pill b">Mitarbeitende</span> ${esc(r.Arbeitnehmer)}</div><div style="margin-top:6px"><span class="pill n">Vorgesetzte</span> ${esc(r.Vorgesetzter)}</div></div></div>`).join('')}<p class="small muted mt">STOPP bei Gefahr: Arbeit einstellen – Gefahr beheben – weiterarbeiten. Jede Person hat das Recht und die Pflicht dazu (Sicherheits-Charta).</p></div>
  <div class="card mt"><h3>Sicherheitsgespräch – 5 Phasen</h3>${STAMM.sicherheitsgespraech.map(p=>`<div class="phase"><b>${esc(p.Phase)}</b><div><div><b>${esc(p.Ziel)}</b> – ${esc(p.Vorgehen)}</div><div style="margin-top:4px"><q>${esc(p.Beispiel)}</q></div><div class="small muted">${esc(p.Nutzen)} · Dokumentation: ${esc(p.Doku)}</div></div></div>`).join('')}</div>
  <div class="card mt"><h3>Fachliche Grundlagen</h3><ul class="small">${STAMM.quellen.filter(q=>q.URL).map(q=>`<li><a href="${esc(q.URL)}" target="_blank" rel="noopener">${esc(q.Quelle)}</a> – ${esc(q.Nutzung)}</li>`).join('')}</ul></div>`;
S.einstellungen=()=>`<div class="head"><div><div class="eyebrow">Einstellungen</div><h1>Kontakt, Erinnerungen, Geräte</h1><p>Angaben für den QR-Aushang, Fristen der Erinnerungen und der Abgleich zwischen mehreren iPads – alles ohne Server.</p></div></div>`+S.einstellungen2()+`<div class="head mt"><div><h1>Daten / Backup</h1><p>Prototyp: Daten liegen nur auf diesem Gerät. Regelmässig sichern.</p></div></div>
  <div class="grid g2"><div class="card"><h3>Sicherung</h3><p class="small muted">JSON enthält alle Baustellen, Personen, Maschinen, Kontrollen, Meldungen, Instruktionen, Fotos und Massnahmen.</p><div class="row"><button class="btn p" onclick="exportJSON()">Backup exportieren (JSON)</button><label class="btn">Backup einlesen (ersetzt alles)<input type="file" accept="application/json" hidden onchange="importJSON(this)"></label></div></div>
  <div class="card"><h3>Export für Microsoft Lists</h3><p class="small muted">CSV passend zu den Listen «Kontrollpunkte», «Massnahmen» und «Personen».</p><div class="row"><button class="btn" onclick="exportCSV('punkte')">Kontrollpunkte</button><button class="btn" onclick="exportCSV('massnahmen')">Massnahmen</button><button class="btn" onclick="exportCSV('personen')">Personen</button></div></div>
  <div class="card"><h3>Testbaustelle (fiktiv)</h3><p class="small muted">Lädt die Demo-Baustelle «Werkleitungssanierung Bahnhofstrasse Etappe 2» mit 7 Personen, 2 Subunternehmern, 6 Maschinen, einem abgeschlossenen Rundgang (Arbeitsstopp mit Wiederaufnahme), Tagescheck, zwei Geräteprüfungen, einem Beinaheunfall, Massnahmen in allen Zuständen und einem angefangenen Rundgang für die Live-Vorführung. Alle Namen und Orte sind erfunden und lassen sich danach bearbeiten.</p><div class="row"><button class="btn p" onclick="demoLaden()">Demo-Baustelle laden</button><button class="btn ghost crit-c" onclick="demoEntfernen()">Demo-Baustelle entfernen</button></div></div>
  <div class="card"><h3>Speicher</h3><p class="small muted">${(JSON.stringify(DB).length/1024/1024).toFixed(2)} MB belegt (Browser-Limit meist ~5 MB; Fotos werden auf 1000 px verkleinert).</p><button class="btn ghost crit-c" onclick="alleLoeschen()">Alles löschen – leeres Programm</button></div>
  <div class="card"><h3>Auf dem iPad installieren</h3><p class="small">Safari → Teilen → «Zum Home-Bildschirm». PDF: «PDF exportieren» → Druckdialog → Teilen → «In Dateien sichern» oder per Mail senden.</p></div></div>`;
async function dl(name,content,type){
  let d=null;try{if(window.claude&&claude.use)d=await claude.use('downloads');}catch(e){}
  if(d){try{await d.save({filename:name,data:content});toast('Datei gespeichert.');}catch(e){if(e&&e.code==='extension_not_enabled'){try{await d.save({filename:name.replace(/\.csv$/,'.txt'),data:content});toast('Als .txt gespeichert (CSV-Inhalt).');}catch(x){if(x.code!=='declined')toast('Speichern nicht möglich: '+x.code);}}else if(e&&e.code!=='declined')toast('Speichern nicht möglich: '+e.code);}return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();}
function exportJSON(){dl(`sicherheitskontrolle_backup_${today()}.json`,JSON.stringify(DB),'application/json');}
function importJSON(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.kontrollen)throw 0;DB=mig(d);save();go('start');toast('Backup eingelesen.');}).catch(()=>toast('Datei ungültig.'));}

/* ---------- Änderungsstempel für den Mehrgeräte-Betrieb ---------- */
let SIG={};
function recSig(r){let s='';const ks=Object.keys(r).sort();
  for(const k of ks){if(k==='_ts'||k==='_dev')continue;const v=r[k];
    if(Array.isArray(v)&&v.length&&typeof v[0]==='string'&&v[0].length>200)s+=k+'#'+v.length+':'+v.map(x=>x.length).join(',')+';';
    else if(typeof v==='string'&&v.length>200)s+=k+'#'+v.length+';';
    else s+=k+':'+JSON.stringify(v)+';';}
  return s;}
function snapSig(){SIG={};SYNCSETS.forEach(key=>(DB[key]||[]).forEach(r=>{if(r&&r.id)SIG[key+'/'+r.id]=recSig(r);}));}
function stampChanges(){const now=new Date().toISOString(),dev=(DB.geraet||{}).id||'?';const neu={};let n=0;
  SYNCSETS.forEach(key=>(DB[key]||[]).forEach(r=>{if(!r||!r.id)return;const k=key+'/'+r.id,s=recSig(r);neu[k]=s;
    if(SIG[k]!==s){r._ts=now;r._dev=dev;n++;}}));
  SIG=neu;if(n){DB.cfg=DB.cfg||{};DB.cfg.aenderungen=(DB.cfg.aenderungen||0)+n;}}
const _save=save;
save=function(){try{stampChanges();}catch(e){}_save();};

function dlg(o){

      `<div class="row sp"><button class="btn ghost" id="dlg_n">${esc(o.abbrechen||'Abbrechen')}</button><button class="btn ${o.gefahr?'danger':'p'}" id="dlg_y">${esc(o.ok||'OK')}</button></div></div>`;
    document.body.appendChild(w);
    const fin=v=>{w.remove();document.removeEventListener('keydown',key);res(v);};
    const key=e=>{if(e.key==='Escape')fin(null);if(e.key==='Enter'&&o.input)ja();};
    const ja=()=>fin(o.input?(document.getElementById('dlg_i').value.trim()||null):true);
    w.querySelector('#dlg_n').onclick=()=>fin(null);

    document.addEventListener('keydown',key);
    const i=w.querySelector('#dlg_i');if(i){i.focus();i.select();}
  });}

/* ---------- QR-Code als SVG ---------- */
function qrSVG(text,px,cls){
  try{const m=QR.encode(text);const n=m.length,q=6,s=n+2*q;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(m[r][c])d+=`M${c+q} ${r+q}h1v1h-1z`;
    return `<svg class="qr ${cls||''}" viewBox="0 0 ${s} ${s}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR-Code"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;}
  catch(e){return `<div class="small crit-c" style="width:${px}px">Text zu lang für QR-Code</div>`;}}

function parseMeldung(t){

/* ---------- Instruktionen und Erinnerungen ---------- */
function cfg(k,d){const v=(DB.cfg||{})[k];return v===undefined||v===''?d:v;}
function faelligAm(datum,monate){if(!datum)return '';const d=new Date(datum+'T12:00:00');d.setMonth(d.getMonth()+ +monate);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function instrDatum(p,t){return (p.instr||{})[t]||'';}
function instrItems(){
  const out=[],vor=+cfg('instrVorlauf',30),av=+cfg('ausweisVorlauf',60),mon=+cfg('instrIntervall',12);
  DB.personen.forEach(p=>{
    THEMEN_PFLICHT.forEach(t=>{const d=instrDatum(p,t);
      if(!d){out.push({typ:'Instruktion',name:p.name,sub:p.funktion,was:t,bis:'',tage:-999,ref:p.id,art:'person'});return;}
      const f=faelligAm(d,mon),tg=daysBetween(today(),f);
      if(tg<=vor)out.push({typ:'Instruktion',name:p.name,sub:p.funktion,was:t+' (letzte '+fmtD(d)+')',bis:f,tage:tg,ref:p.id,art:'person'});});
    (p.ausweise||[]).forEach(a=>{const bis=(p.ausweisBis||{})[a];if(!bis)return;const tg=daysBetween(today(),bis);
      if(tg<=av)out.push({typ:'Ausweis',name:p.name,sub:p.funktion,was:a,bis,tage:tg,ref:p.id,art:'person'});});
    if(p.fahrBis){const tg=daysBetween(today(),p.fahrBis);
      if(tg<=av)out.push({typ:'Fahrausweis',name:p.name,sub:p.funktion,was:'Führerausweis'+((p.fahr||[]).length?' Kat. '+p.fahr.join('/'):''),bis:p.fahrBis,tage:tg,ref:p.id,art:'person'});}
    if(p.czvBis){const tg=daysBetween(today(),p.czvBis);
      if(tg<=av)out.push({typ:'Fahrausweis',name:p.name,sub:p.funktion,was:'CZV / Chauffeurzulassung',bis:p.czvBis,tage:tg,ref:p.id,art:'person'});}});
  DB.subs.forEach(s=>{if(!s.instr)out.push({typ:'Subunternehmer',name:s.firma,sub:(s.gewerk||'')+(s.baustelle?' · '+bs(s.baustelle).name:''),was:'Instruktion auf der Baustelle fehlt',bis:'',tage:-999,ref:s.baustelle,sub2:s.id,art:'sub'});});
  DB.baustellen.filter(b=>b.status==='Aktiv').forEach(b=>{const s=b.sige||{};
    if(!s.instruiert)out.push({typ:'SiGe-Konzept',name:b.name,sub:b.ort||'',was:'Mitarbeitende noch nicht auf das SiGe-Konzept instruiert',bis:'',tage:-999,ref:b.id,art:'baustelle'});});
  DB.maschinen.forEach(m=>{if(!m.naechste)return;const tg=daysBetween(today(),m.naechste);
    if(tg<=30)out.push({typ:'Geräteprüfung / Wartung',name:m.name+' · '+m.inv,sub:m.typ,was:'nächste Prüfung',bis:m.naechste,tage:tg,ref:m.id,art:'maschine'});});
  return out.sort((a,b)=>a.tage-b.tage);}
function instrStatusText(i){return i.tage<=-999?'fehlt':i.tage<0?Math.abs(i.tage)+' Tage überfällig':i.tage===0?'heute fällig':'in '+i.tage+' Tagen';}

  </tbody></table></div>
  <div class="row mt"><button class="btn p" onclick="instrSpeichern()">Instruktion speichern und Teilnehmerliste erzeugen</button></div>${DL()}</div>
  <div class="card mb"><h3>Fällig und überfällig (${items.length})</h3>
  ${items.length?`<div class="tw"><table class="tb"><thead><tr><th>Art</th><th>Wer / was</th><th>Betrifft</th><th>Fällig</th><th>Status</th><th></th></tr></thead><tbody>
  ${items.map(i=>`<tr><td>${esc(i.typ)}</td><td><b>${esc(i.name)}</b><br><small class="muted">${esc(i.sub||'')}</small></td><td>${esc(i.was)}</td><td>${i.bis?fmtD(i.bis):'–'}</td><td class="${i.tage<0?'crit-c':''}">${instrStatusText(i)}</td><td>${i.art==='person'?`<button class="btn sm ghost" onclick="go('personen',{edit:'${i.ref}'})">öffnen</button>`:i.art==='maschine'?`<button class="btn sm ghost" onclick="go('maschinen',{edit:'${i.ref}'})">öffnen</button>`:i.art==='sub'?`<button class="btn sm p" onclick="subInstruiert('${i.sub2}')">instruiert</button>`:`<button class="btn sm ghost" onclick="go('baustellen',{edit:'${i.ref}'})">öffnen</button>`}</td></tr>`).join('')}
  </tbody></table></div><div class="row mt"><button class="btn" onclick="instrErinnerung()">Erinnerung als E-Mail vorbereiten</button></div>`:'<p class="muted small">Alles aktuell – keine Instruktion und kein Ausweis fällig.</p>'}</div>
  ${(DB.instruktionen||[]).length?`<div class="card"><h3>Durchgeführte Instruktionen</h3><div class="list">${DB.instruktionen.slice().sort((a,b)=>b.datum.localeCompare(a.datum)).map(x=>`<button class="item" onclick="go('instrPdf',{id:'${x.id}'})"><span class="pill g">${fmtD(x.datum)}</span><span><div class="ti">${esc(x.thema)}</div><div class="su">${esc(x.nr)} · ${x.teilnehmer.length} Teilnehmende · durch ${esc(x.durch)}${x.ort?' · '+esc(x.ort):''}</div></span><span class="ch">›</span></button>`).join('')}</div></div>`:''}`;
};
function inSel(all){document.querySelectorAll('.in_p').forEach(c=>c.checked=!!all);}
function instrSpeichern(){
  const t=route.thema||THEMEN[0];const d=document.getElementById('in_d').value||today();const v=document.getElementById('in_v').value.trim();

/* ---------- Mehrgeräte-Betrieb: Abgleich ohne Server ---------- */
function mergePlan(inc){
  const rep={neu:0,akt:0,behalten:0,gleich:0,det:[]};
  SYNCSETS.forEach(key=>{const loc=DB[key]||[];const idx={};loc.forEach(r=>idx[r.id]=r);let n=0,a=0,b=0,g=0;
    (inc[key]||[]).forEach(r=>{const l=idx[r.id];
      if(!l)n++;else{const ta=l._ts||'',tb=r._ts||'';if(tb>ta)a++;else if(ta>tb)b++;else g++;}});
    rep.neu+=n;rep.akt+=a;rep.behalten+=b;rep.gleich+=g;
    if(n||a||b)rep.det.push({key,n,a,b});});
  return rep;}
function mergeApply(inc){
  SYNCSETS.forEach(key=>{const loc=DB[key]||(DB[key]=[]);const idx={};loc.forEach((r,i)=>idx[r.id]=i);
    (inc[key]||[]).forEach(r=>{const i=idx[r.id];
      if(i===undefined)loc.push(r);else{const ta=loc[i]._ts||'',tb=r._ts||'';if(tb>ta)loc[i]=r;}});});
  DB.seq=Math.max(DB.seq||0,inc.seq||0);
  DB.cfg=DB.cfg||{};const c=inc.cfg||{};['sibeName','sibeMail','sibeTel','firma','appUrl'].forEach(k=>{if(!DB.cfg[k]&&c[k])DB.cfg[k]=c[k];});}
function importMerge(inp){const f=inp.files[0];if(!f)return;inp.value='';
  f.text().then(t=>{const d=JSON.parse(t);if(!d.kontrollen)throw 0;
    SYNCSETS.forEach(k=>d[k]=d[k]||[]);
    const rep=mergePlan(d);
